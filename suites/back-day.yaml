# The back-day suite (D-39, docs/design/observability-v1.md section 7): `cfctl eval suite --suite ../../suites/back-day.yaml` from
# apps/server. The ids here are placeholders: a creator's footage, references and renders are never committed. Put the real ones in
# suites/back-day.local.yaml (gitignored), which uses the same shape and overrides by case id, for example:
#
#   defaults:
#     workspace: wks_...
#     references_dir: ~/Downloads/gino_tiktok
#   cases:
#     - id: back-day-lively
#       footage: [ast_..., ast_...]
#       song: ast_...
#       stored: {project: prj_..., version: 4}
#
# A case with `stored` is scored on that version without an editor run (free, except a judge call that is not cached); with --live and
# --max-usd the cases with footage are edited again first. A calibration case is a version whose human verdict is known: the judge's
# scores are checked against it, and it does not count in the suite's mean. A held-out case is never shown to the improvement loop.
suite: back-day
description: "Gino's back day: posing hook, seated rows and lat pulldowns, his song, his cream 101 titles and long takes."
feedback: feedback.yaml
defaults:
  workspace: wks_PLACEHOLDER
  profile: v1-start
  vibe: lively
  budget_usd: 1.00
  references_dir: PLACEHOLDER_references_dir
# Rubric items of every case but the calibration ones (judge_edit.v5 is shown the format the plan chose and the creator's usual formats).
rubric:
  - id: clear-concept
    text: "A clear concept: a viewer could say in a few words what the video is (a 101 tutorial, a numbered list, a reveal on the drop, ...); its hook sets the format up, the middle delivers it and the payoff lands."
    weight: 1
cases:
  - id: back-day-lively
    title: "Back day, lively, the creator's song"
    footage: [ast_PLACEHOLDER_back_pose, ast_PLACEHOLDER_back_extension, ast_PLACEHOLDER_cable_row_rear, ast_PLACEHOLDER_machine_row_side, ast_PLACEHOLDER_cable_row_back]
    song: ast_PLACEHOLDER_song
    brief: "Back-day short for a fitness creator: hook with the posing flex in the first 2 seconds, then the cleanest reps from seated rows and lat pulldowns, varied angles, 15-25 seconds, a punchy title."
    vibe: lively
    stored: {project: prj_PLACEHOLDER_lively, version: 1}
    expectations:
      - id: posing-hook
        text: "The video opens on the back pose (the flex), and the title is on screen within the first half second."
        weight: 2
      - id: clean-reps
        text: "Every rep shown is a whole rep: no shot starts or ends in the middle of the movement."
        weight: 1
      - id: creator-title-look
        text: "The title looks like the creator's own: cream, upper case, '... 101' form, placed off the body."
        weight: 1
  - id: back-day-calm
    title: "Back day, calm"
    footage: [ast_PLACEHOLDER_back_pose, ast_PLACEHOLDER_cable_row_rear, ast_PLACEHOLDER_machine_row_side]
    song: ast_PLACEHOLDER_song
    brief: "A calm back-day video: the pose, then a few long clean reps, 20-30 seconds."
    vibe: calm
    stored: {project: prj_PLACEHOLDER_calm, version: 1}
    expectations:
      - id: breathing-room
        text: "The pace is calm but never dead: shots breathe, and something moves in every shot."
        weight: 1
  - id: back-day-held-out
    title: "Back day, hype (held out)"
    footage: [ast_PLACEHOLDER_back_pose, ast_PLACEHOLDER_cable_row_back, ast_PLACEHOLDER_back_extension]
    song: ast_PLACEHOLDER_song
    brief: "Hype back-day short, fast cuts on the beat, 15 seconds."
    vibe: hype
    held_out: true
    stored: {project: prj_PLACEHOLDER_hype, version: 1}
  # "Try another idea" on a finished back-day project. Without --live the stored new-idea version is judged. With --live each sample
  # makes a new version on the stored project (the project gains versions) in a format none of the versions up to idea_from used, so
  # the --repeat samples avoid the same formats and stay comparable.
  - id: back-day-new-idea
    title: "Back day, try another idea"
    vibe: lively
    new_idea: true
    idea_from: 1
    stored: {project: prj_PLACEHOLDER_new_idea, version: 2}
    expectations:
      - id: novelty
        text: "Novelty against the creator's usual formats: a different concept from their go-to formats and from the project's first version, still in their style, and done well."
        weight: 1
  # A second footage set, never shown to the improvement loop: another training day (chest and leg machines, a triceps pushdown, a
  # 120 fps slow-motion curl), another song (130 BPM, 15 s). It checks that a change helps edits in general, not only the back day.
  - id: mixed-day-held-out
    title: "Mixed upper and leg day, another song (held out)"
    footage: [ast_PLACEHOLDER_slowmo_curl, ast_PLACEHOLDER_leg_press, ast_PLACEHOLDER_incline_press, ast_PLACEHOLDER_plate_machine, ast_PLACEHOLDER_leg_curl, ast_PLACEHOLDER_pushdown, ast_PLACEHOLDER_chest_press]
    song: ast_PLACEHOLDER_song_130
    brief: "A training-day short for a fitness creator: the cleanest reps from these machines, varied angles, the slow-motion curl as a highlight, 15 seconds to fit the song, a punchy title."
    vibe: lively
    held_out: true
    expectations:
      - id: slowmo-highlight
        text: "The slow-motion curl is used as a highlight (at its own slow speed), not sped back up to real time."
        weight: 1
      - id: clean-reps
        text: "Every rep shown is a whole rep: no shot starts or ends in the middle of the movement."
        weight: 1
  # The calibration set: the founder called v4 of this project "sick", except its transitions.
  - id: calibration-founder-v4
    title: "Founder's verdict: v4 'sick' except the transitions"
    stored: {project: prj_PLACEHOLDER_calibration, version: 4}
    calibration:
      note: "The founder: 'sick', except its transitions (they read as AI)."
      expect:
        hook: [4, 5]
        energy_pace: [4, 5]
        story_arc: [3, 5]
        ai_look: [3, 5]
