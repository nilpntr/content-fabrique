<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The only fonts the image knows are the ones in /usr/share/fonts/cf (see fonts/README in the Dockerfile). The cache
     goes to /tmp, which is a tmpfs: the root filesystem is read-only. -->
<fontconfig>
  <dir>/usr/share/fonts/cf</dir>
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
