openapi: 3.1.0

# The contract of the Go API (P0-08, D-14). This file is the source of truth: the Go server interfaces
# (apps/server/internal/api) and the TypeScript types (packages/schemas/api/schema.ts) are generated from it with
# `task gen:api`, and CI fails when they are out of date. See docs/03-architecture.md section 9 for how to add an endpoint.
#
# Paid by default: every /v1 operation is behind the paywall (402 plan_required without an active plan), and must document
# that 402 response ($ref PlanRequired). An operation opts out with `x-open-without-plan: true`, which the Go server reads
# from this spec (embedded in the generated code) to put it behind authentication alone; apps/server/internal/auth tests
# that the two always agree. Only GET /v1/me and GET /v1/workspace/plan are open (and the webhook, which has no session at
# all). An operation added here is paid-only until someone opens it on purpose.

info:
  title: Content Fabrique API
  version: 0.1.0
  summary: The REST API of the Content Fabrique server.
  description: |
    REST and JSON. Every endpoint but the health probes and the webhooks needs a Clerk session token in
    `Authorization: Bearer <token>`; there are no cookies. Errors always have the shape
    `{ "error": { "code": "...", "message": "..." } }`. `code` is stable and meant for programs; `message` is for people
    and may change. Neither ever contains request data, a token or a secret.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.contentfabrique.app
    description: Production
  - url: https://api-staging.contentfabrique.app
    description: Staging
  - url: http://localhost:8080
    description: Local development (`task dev`)

tags:
  - name: account
    description: Who is calling, and in which workspace.
  - name: workspace
    description: The active workspace and its plan.
  - name: library
    description: The creator's library (paid-only).
  - name: assets
    description: Footage, audio and images, and their resumable multipart upload to object storage (paid-only).
  - name: projects
    description: Projects (a video job with its format, footage and brief) and their timeline versions (paid-only).
  - name: runs
    description: Agent runs. The editor agent edits a project's timeline in a run; the run is a record of every step, its cost and its result (paid-only).
  - name: renders
    description: Renders of a project's timeline versions, the preview and the final MP4, with their time map and contact sheet (paid-only).
  - name: style
    description: The creator's style - the summary of how their finished videos look, the settings they choose, and the reference videos it is learnt from (paid-only).
  - name: annotations
    description: Comments on a clip, on a render or on a version of a timeline - on a range of time, with a kind and an optional pin on the frame (paid-only).
  - name: webhooks
    description: Called by other services, not by the web app. Not part of the generated TypeScript client or of the generated Go server interface.

security:
  - bearerAuth: []

paths:
  /v1/me:
    get:
      operationId: getMe
      x-open-without-plan: true
      tags: [account]
      summary: The signed-in user, the active workspace and its plan
      description: |
        Open to a workspace without a plan: it is how the web app finds out. A plan that cannot be read does not fail the
        request; it is reported as `entitlements.status = "unknown"` (never active).

        `credits` is the workspace's credit balance (spend control, D-31). It is left out when the balance cannot be read, which
        does not fail the request either.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/workspace/plan:
    get:
      operationId: getWorkspacePlan
      x-open-without-plan: true
      tags: [workspace]
      summary: The plan of the active workspace and what it includes
      description: "Open to a workspace without a plan (it answers `active: false` and zero limits)."
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlanResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/library/summary:
    get:
      operationId: getLibrarySummary
      tags: [library]
      summary: Counts of the workspace's library
      description: |
        The first paid-only endpoint. There is no library yet (P1), so the counts are zero; it exists to prove the paywall
        on the API.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/assets:
    post:
      operationId: createAsset
      tags: [assets]
      summary: Start an upload
      description: |
        Creates the asset (status `uploading`) and its multipart upload, and returns presigned `PUT` URLs for the first
        parts. The server picks the part size (`upload.part_size`, at least 8 MiB, at most 10,000 parts) and the object key;
        the client never names a key. The client uploads each part with a plain `PUT` of exactly `size_bytes` bytes to its
        URL (no other header is needed), keeps the `ETag` response header of every part, asks for more URLs with
        `POST /v1/assets/{id}/parts`, and finishes with `POST /v1/assets/{id}/complete`. A part URL is valid for 15 minutes;
        the upload as a whole for 24 hours.
        Only owners and editors may upload. At most 25 uploads can be in progress per workspace.

        `purpose: style_reference` uploads one of the creator's own finished videos as a style reference (see `getStyle`): it is
        never listed with the footage and cannot be used in a project, and once its ingest is done its style is measured in the
        background. A style reference must be a video of at most 1 GiB (`413 file_too_large`, `415 unsupported_content_type`) and
        at most 3 minutes long (a longer one ends `failed` with `too_long`); a workspace has at most 10 that are not failed
        (`409 too_many_references`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: The asset and the first batch of part URLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAssetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`too_many_references`: the workspace has its 10 style references already (remove one first)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "`file_too_large`: more than 20 GB, or a style reference of more than 1 GiB."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`unsupported_content_type`: not one of the accepted media types, or a style reference that is not a video."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`too_many_uploads`: the workspace already has 25 uploads in progress."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listAssets
      tags: [assets]
      summary: List the workspace's assets, newest first
      description: |
        Cursor pagination. Deleted assets are not listed. A `ready` asset carries its `media` facts and short-lived
        `derivatives` URLs, as in `getAsset`.
        With `q` only the assets that match the search are listed (still newest first, same cursor): every word of `q`
        must occur, as the start of a word, in the asset's title, description, tags or file name, with English stemming
        (`row` finds "Barbell rows"). Characters other than letters and digits only separate words; a `q` without any
        word lists everything.
        Only the assets of one `purpose` are listed: the footage by default, the style references with `purpose=style_reference`.
      parameters:
        - name: purpose
          in: query
          required: false
          description: Which assets to list (default `footage`, the library).
          schema:
            $ref: "#/components/schemas/AssetPurpose"
        - name: q
          in: query
          required: false
          description: Search words, at most 100 characters. At most the first 8 words are used.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: How many assets to return (default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page. Opaque.
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: A page of assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAssetsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/assets/{id}:
    parameters:
      - $ref: "#/components/parameters/AssetIdPath"
    get:
      operationId: getAsset
      tags: [assets]
      summary: One asset
      description: |
        An asset of another workspace, or one that does not exist, is `404 not_found`. While the asset is `processing`,
        `ingest_progress` and `ingest_stage` say how far the ingest is. Once it is `ready`, `media` holds what the probe
        found and `derivatives` holds a presigned GET URL per generated file (see `AssetDerivatives`); the URLs stop working
        at `derivative_urls_expire_at`, so fetch the asset again for fresh ones.
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Edit an asset's title
      description: |
        Sets the title. The title is cleaned like every title (control characters, markup characters and extra spaces
        removed) and must have 1 to 255 characters left. From then on the asset's `title_source` is `user` and the quick
        look never overwrites the title again. Only owners and editors may edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetRequest"
      responses:
        "200":
          description: The asset as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete an asset
      description: |
        Soft-deletes the asset and enqueues the deletion of its objects. An asset whose upload is still in progress is
        aborted as well. A style reference is not deleted here (`409 style_reference`): `DELETE /v1/style/references/{id}`
        removes it with what was measured from it and makes the style again. Only owners and editors may delete.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`style_reference`: the asset is a style reference; remove it with `DELETE /v1/style/references/{id}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/assets/{id}/upload:
    parameters:
      - $ref: "#/components/parameters/AssetIdPath"
    get:
      operationId: getAssetUpload
      tags: [assets]
      summary: The state of an upload, to resume it
      description: |
        What a client needs after a reload: the part size and count, and the parts object storage already holds
        (`completed_parts`, from `ListParts`: number, ETag and size). Upload the parts that are not listed, then complete.
        The state stays readable after the upload is completed, aborted or expired (`upload.status`); then
        `completed_parts` is empty.
      responses:
        "200":
          description: The upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: abortAssetUpload
      tags: [assets]
      summary: Abort an upload
      description: |
        Aborts the multipart upload (its parts are discarded) and removes the asset. Only owners and editors may abort.
        Aborting twice is `404 not_found`; an upload that is already completed is `409 upload_not_active`.
      responses:
        "204":
          description: Aborted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/assets/{id}/sprite.vtt:
    parameters:
      - $ref: "#/components/parameters/AssetIdPath"
    get:
      operationId: getAssetSpriteVtt
      tags: [assets]
      summary: The hover-scrub thumbnails track, with working URLs
      description: |
        The WebVTT thumbnails track of a `ready` video, with every cue pointing at the sprite sheet through a fresh presigned
        URL (`https://...?X-Amz-...#xywh=x,y,w,h`), so a player can use it as is. The file stored in object storage
        (`derivatives.sprite_vtt`) names the sheet relatively and cannot work on its own, because the sheet's URL is signed and
        expires; this endpoint is how to get a track that works. It needs the same authentication as the rest of the API, so
        fetch it with the bearer token and hand the text to the player (for example as a Blob URL for a `<track>`). The cue URLs
        stop working at the same time as `derivative_urls_expire_at`. `404 not_found` when the asset has no sprite track (not
        ready yet, an audio file, an image).
      responses:
        "200":
          description: The track, `text/vtt`.
          content:
            text/vtt:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/assets/{id}/transcript:
    parameters:
      - $ref: "#/components/parameters/AssetIdPath"
    get:
      operationId: getAssetTranscript
      tags: [assets]
      summary: The words spoken in an asset, with timings and speech structure
      description: |
        The transcript of an asset whose `transcript_status` is `ready` or `no_speech`. The transcription job runs after the
        ingest, on clips with speech only (a voice-activity check comes first), so a clip without speech has a transcript with
        `speech: false` and no words. Word times are milliseconds from the start of the asset. `structure` is derived from the
        words: sentence boundaries, filler words (um, uh, "you know" ...) and pauses longer than 400 ms, with indexes into `words`,
        for jump cuts and captions. `404 not_found` when the asset does not exist in the workspace or has no transcript yet
        (`transcript_status` is `none`, `pending` or `failed`: read it from the asset).
      responses:
        "200":
          description: The transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/assets/{id}/parts:
    parameters:
      - $ref: "#/components/parameters/AssetIdPath"
    post:
      operationId: presignAssetParts
      tags: [assets]
      summary: Presigned URLs for more parts
      description: Up to 100 part numbers at a time, each between 1 and `upload.part_count`. Only for an upload that is in progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignPartsRequest"
      responses:
        "200":
          description: The URLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignPartsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/assets/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/AssetIdPath"
    post:
      operationId: completeAssetUpload
      tags: [assets]
      summary: Finish an upload
      description: |
        Sends every part with its ETag. The server checks them against what object storage holds (all `part_count` parts,
        the right sizes), completes the multipart upload, checks that the object is exactly `size_bytes` long, marks the
        asset `uploaded` and enqueues its ingest job. Completing an upload that was already completed answers 200 again.
        Only owners and editors may complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAssetRequest"
      responses:
        "200":
          description: The asset, now `uploaded`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "422":
          description: |
            `parts_mismatch` (a part is missing, or its ETag or size is not what object storage holds: upload it again and
            complete again) or `size_mismatch` (the stored object is not `size_bytes` long; the upload failed and the asset
            is `failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/projects:
    post:
      operationId: createProject
      tags: [projects]
      summary: Start a project
      description: |
        Creates a project from the new-project flow (P4-04b): the output `format`, the selected footage (`asset_ids`, 1 to 50,
        in the order given) and the optional `brief`. Every asset must exist in this workspace and be `ready` (probed and
        ingested) and a video or an audio file. An asset id that is unknown, deleted or belongs to another workspace is
        `404 not_found` (the same answer for all three, so an id from another workspace cannot be told from one that never
        existed); assets that exist but are not usable (still uploading or processing, failed, or an image) make it
        `422 assets_not_usable`. A style reference is never footage: naming one is `422 assets_not_usable` too.
        The project starts with no timeline: `current_timeline_version` is `null`. A timeline needs at least one clip, so
        version 1 is made by the first edit (`POST /v1/projects/{id}/timelines` with `base_version` 0, or the editor run).
        Only owners and editors may create projects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`assets_not_usable`: an asset is not `ready`, or is an image. The message names the assets."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the workspace's projects, newest first
      description: Cursor pagination. Deleted projects are not listed.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many projects to return (default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page. Opaque.
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      operationId: getProject
      tags: [projects]
      summary: One project, with its footage and current timeline version
      description: |
        A project of another workspace, a deleted one, or one that does not exist is `404 not_found`. `assets` lists the
        footage in order (an asset deleted since is still listed, with `available` false). `current_version` is the summary
        of the latest timeline version, `null` before the first edit.
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      description: Soft-deletes the project. Its assets stay in the library. Only owners and editors may delete.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/projects/{id}/timelines:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    get:
      operationId: listTimelineVersions
      tags: [projects]
      summary: The versions of a project's timeline, newest first
      description: |
        One entry per version, without the spec: its number, parent, author, the summary lines of what changed
        (`diff.Summarize`) and when it was made. Page with `before` (the `next_before` of the previous page).
      parameters:
        - name: limit
          in: query
          required: false
          description: How many versions to return (default 100).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: before
          in: query
          required: false
          description: Only versions below this number.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A page of versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTimelineVersionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: applyTimelineOps
      tags: [projects]
      summary: Edit the timeline with ops (a manual tweak, or the editor agent's tool)
      description: |
        Applies a batch of edit ops (`packages/schemas/timeline/ops.v1.schema.json`, 1 to 100) to version `base_version`,
        atomically, and stores the result as the next version, with its diff and summary; the author is the caller (`user`).
        `base_version` is the version the client was looking at, and 0 for a project that has no timeline yet (the first
        batch builds version 1 from an empty timeline of the project's format and size). If it is not the current version
        the answer is `409 version_conflict` and nothing is stored: fetch the project again and decide.
        The ops may only use the project's own footage that is `ready`: an op that names any other asset (another project's,
        another workspace's, one that does not exist) fails with an `unknown_asset` issue. A batch the engine refuses, or that
        leaves the timeline invalid, is `422 invalid_ops` with the issues (each names the op); a batch that changes nothing is
        `422 no_change`. Only owners and editors may edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyTimelineOpsRequest"
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyTimelineOpsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`version_conflict`: `base_version` is not the project's current version."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`invalid_ops` or `no_change`, with the issues the engine found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsRejected"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/projects/{id}/timelines/{version}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
      - name: version
        in: path
        required: true
        description: The version number, from 1.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getTimelineVersion
      tags: [projects]
      summary: One version of a project's timeline, with its spec and validation issues
      description: |
        The full spec (`packages/schemas/timeline/v1.schema.json`), the ops and the diff that made it, and the issues of
        validating the spec now against the project's footage (a clip whose asset was deleted since is reported as
        `unknown_asset`; the stored version itself never changes).
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/projects/{id}/edit:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    post:
      operationId: startEdit
      tags: [runs]
      summary: Start an editor run on the project
      description: |
        Starts the editor agent on the project: it looks at the project's footage, builds the timeline with edit ops (each one a
        new timeline version, authored by the run) and ends with a message for the creator. The call only creates the run and
        returns it (`202`, status `queued`); follow it with `GET /v1/runs/{id}`. Only owners and editors may start a run.
        A project has at most one unfinished editor run (`409 run_in_progress`), and needs at least one ready video clip
        (`422 assets_not_usable`; an audio file is not a clip to cut).
        `instructions` is the creator's extra instruction for this run (text, at most 2,000 characters; the model treats it as data
        that steers the content of the video, nothing else). `profile` picks the model profile of the run; the default is the
        server's. `vibe` is the energy of this edit (`calm`, `lively` or `hype`); without it the workspace's style decides
        (`GET /v1/style`, `effective.vibe`, `lively` when nothing is set): see `EditVibe`. An audio file in the project's footage is a
        song the edit can be cut to (D-34): the export then has the song and no clip sound under it.

        **Credits.** The run costs credits, set aside (held) in the same step that creates the run: the server decides from the
        project whether it is the first edit (6 credits: the project has no charged edit yet) or a revision (2 credits), and the
        price comes from the server's price list, never from the request. A workspace with fewer credits available than that gets
        `402 credits_exhausted` and no run is created (a workspace with no active plan gets `402 plan_required`, as everywhere). A workspace
        on a BYOK plan (studio) pays for the model with its own Anthropic key: until it has one the start is refused with
        `402 byok_key_required` and no run is created.

        A run that is cancelled before it made anything, finds nothing to change, or fails for a reason of the creator's own (it used
        its whole budget without anything usable, the model declined the content, the project no longer fits the model) is released:
        no credits are charged, but it has used model time. A workspace may have 5 such runs per UTC day on every plan, counting the runs
        it has in progress and the new one; the next start is refused with `429 too_many_uncharged_runs` until the next UTC day. Runs
        that cost nothing, runs that are charged, and failures on our side do not count. (A workspace that is out of credits is told
        that first, with `402 credits_exhausted`.)
        The credits are charged when the run succeeds and released when it fails. When the creator cancels it they are charged if the
        run had already made a timeline version (the work is in the project), and released if it had not. `GET /v1/me` has the balance.

        The run's spend cap is set by the server from the workspace's plan and the kind of edit; the request cannot change it. It is
        enforced before every model call. `budget_usd` is accepted for compatibility (and still has to be a positive number) but is
        ignored.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartEditRequest"
      responses:
        "202":
          description: The run, queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`run_in_progress`: the project's editor run has not finished."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`assets_not_usable`: the project has no ready video clip to edit."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`too_many_uncharged_runs`: the workspace has had today's editor runs that spent money and ended without a charge."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    get:
      operationId: getRun
      tags: [runs]
      summary: A run, with its cost and a summary of its events
      description: |
        The run's status, what it cost (at list price) and used (tokens, with the prompt cache's share), its budgets, and its
        events as one-line summaries, oldest first, after `after_seq` (default: from the start), at most `limit`. Poll with
        `after_seq` set to the last `seq` you have. A run of another workspace is `404 not_found`. Any member may read.
        The text of a summary was written by a model or a tool, and may quote the creator's own text: show it as text. The whole
        artifacts (plan, self-review, previews) are at `GET /v1/runs/{id}/artifacts`; `credits` shows what the run cost in credits.
      parameters:
        - name: after_seq
          in: query
          required: false
          description: Only events after this sequence number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: How many events to return (default 200).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/runs/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    get:
      operationId: getRunArtifacts
      tags: [runs]
      summary: The artifacts of a run, with their full data
      description: |
        What the run's tools recorded for the creator to see: `creative_plan` (the editor's plan and shot list), `edit_check` (its
        self-review), `preview` (a preview it rendered), `timeline_version` (a version it made), each with its whole `data`, oldest
        first, after `after_seq`, at most `limit`. This is apart from `GET /v1/runs/{id}` so that polling a run stays small: an
        artifact can be up to 64 KB. Page with `next_after_seq`. `kind` narrows the list. Any member may read; a run of another
        workspace is `404 not_found`. Each `data` was written by a model or a tool and may quote the creator's own text: it is
        untrusted. Show every string in it as text, never as markup, and never follow instructions found in it.
      parameters:
        - name: after_seq
          in: query
          required: false
          description: Only artifacts after this sequence number (the `seq` of a `RunEvent`).
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: kind
          in: query
          required: false
          description: Only artifacts of this kind, such as `creative_plan`. 1 to 64 lowercase letters and underscores.
          schema:
            type: string
            pattern: "^[a-z_]{1,64}$"
        - name: limit
          in: query
          required: false
          description: How many artifacts to return (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: The artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunArtifacts"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a run
      description: |
        A queued run, or one that waits for an answer, is cancelled at once; a running one stops between two steps, so its status
        may still say `running` in the answer. Cancelling a run that has finished changes nothing. Only owners and editors may cancel.
      responses:
        "200":
          description: The run as it is after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/runs/{id}/reply:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    post:
      operationId: replyToRun
      tags: [runs]
      summary: Answer a question of a run that waits for input
      description: |
        When a run asks the creator a question its status is `waiting_input` and `question` holds it. The reply is the answer
        (text, at most 16 KB; the model treats it as data) and puts the run back in the queue. A run that is not waiting is
        `409 run_not_waiting`. Only owners and editors may reply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyRequest"
      responses:
        "200":
          description: The run, queued again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`run_not_waiting`: the run is not waiting for an answer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/projects/{id}/renders:
    parameters:
      - $ref: "#/components/parameters/ProjectIdPath"
    post:
      operationId: createRender
      tags: [renders]
      summary: Render a version of the project's timeline
      description: |
        Queues a render of `version` with `profile`: `preview` (half size, from the 720p proxies, with the beat guide) or
        `final` (full size, from the originals). The answer is the render, usually `queued`; poll `GET /v1/renders/{id}` for
        `progress` and the files. Asking again for a version and profile that has a render waiting, running or ready returns
        that render (`200`) and queues nothing; a failed render does not count, so asking again after a failure starts a new one.
        The version must exist and validate against the project's footage as it is now (`422 timeline_invalid` otherwise: an asset
        deleted since the edit, say). At most 5 renders per workspace are in flight at once (`429 too_many_renders`). Only
        owners and editors may render.

        A `final` render (the export) costs no credits but must be of paid-for work. The project needs an edit that was charged (no
        successful editor run: `422 edit_not_charged`), and the version must be covered: the last editor-made version at or before
        it must come from a run that was charged. A person's own edits on top of a charged version are free to export; a version
        made by a run that failed or was released, and edits made on top of it, are refused with `422 version_not_charged` until a
        later editor run is charged. A queued final render is recorded on the credit ledger as the `export.final` action at 0
        credits. Previews of any version are never refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRenderRequest"
      responses:
        "200":
          description: The existing render of that version and profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "202":
          description: A new render was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |
            `timeline_invalid`: the version does not validate against the project's footage now. Or `edit_not_charged`: a final
            render of a project that has no charged edit. Or `version_not_charged`: a final render of a version that holds editor
            work that was not charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`too_many_renders`: the workspace already has 5 renders waiting or running."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listRenders
      tags: [renders]
      summary: The renders of a project, newest first
      description: |
        Page with `cursor` (the `next_cursor` of the previous page). `version` and `profile` narrow the list. The renders in a list
        carry no presigned URLs (`files` and `urls_expires_at` are `null`); fetch the one you want with `GET /v1/renders/{id}`.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many renders to return (default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: Only renders of this timeline version.
          schema:
            type: integer
            minimum: 1
        - name: profile
          in: query
          required: false
          description: Only renders of this profile.
          schema:
            $ref: "#/components/schemas/RenderProfile"
      responses:
        "200":
          description: A page of renders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRendersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/renders/{id}:
    parameters:
      - $ref: "#/components/parameters/RenderIdPath"
    get:
      operationId: getRender
      tags: [renders]
      summary: One render, with its progress and, once ready, presigned URLs for its files
      description: |
        A render of another workspace, of a deleted project, or one that does not exist is `404 not_found`. While `status` is
        `queued` or `rendering`, `progress` (0 to 100) and `stage` say how far it is. Once `ready`, `files` holds a presigned GET
        URL for the MP4, the contact sheet (a JPEG) and the time map (JSON), each valid for 30 minutes (`urls_expires_at`);
        fetch the render again for fresh ones. `failure_reason` is a code that is safe to show when `status` is `failed`.
      responses:
        "200":
          description: The render.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/style:
    get:
      operationId: getStyle
      tags: [style]
      summary: The creator's style
      description: |
        Everything the editor knows of how this creator's videos look and what the creator chose:

        - `summary`: a short description in plain words written by a model from the measures of the reference videos, with the
          settings it suggests (`summary.suggested`); `null` until the references were learnt.
        - `measures`: what was measured from the reference videos, in plain words (`lines`); `null` without any.
        - `settings`: the creator's own settings (`PUT /v1/style`). A setting that is absent is not set.
        - `effective`: what the editor follows, every setting decided, with where each came from (`sources`): the creator's own
          setting wins, then the suggestion, then the measures, then the default. A measured "no effects" never turns transitions or
          text animation off at a lively or hype vibe on its own.
        - `references`: the reference videos (uploaded with `POST /v1/assets` and `purpose: style_reference`) with the state of their
          analysis, and `status`/`progress` for the whole: `learning` while any reference is being uploaded, ingested or measured, or
          the profile is being made from them.

        A workspace with nothing has `status: empty` and the default settings. Every role may read it.
      responses:
        "200":
          description: The style.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorStyle"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateStyle
      tags: [style]
      summary: Set the creator's settings
      description: |
        Replaces the creator's settings with `settings`: a setting that is absent is not set (the suggestion and the measures decide
        it). Learning the style again never changes them. Only owners and editors may change them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStyleRequest"
      responses:
        "200":
          description: The style as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorStyle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: resetStyle
      tags: [style]
      summary: Forget the creator's style
      description: |
        Deletes the reference videos (their files are removed in the background), everything measured from them, the summary and the
        creator's settings. Only owners and editors may reset it.
      responses:
        "204":
          description: Forgotten.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/style/relearn:
    post:
      operationId: relearnStyle
      tags: [style]
      summary: Learn the style again from the reference videos
      description: |
        Measures every reference video again and writes a new summary, in the background (`202`; follow `status` with
        `GET /v1/style`). The creator's settings stay, and so do the profile and the summary the editor uses until every reference is
        measured again; then the profile is made once and one summary is written. Each reference costs at most $0.01 of model time
        and the pass's one summary at most $0.03, metered like every model call. While a pass (or a new reference) is being measured
        another is refused (`409 style_learning_in_progress`), and a workspace may start as many passes per UTC day as its plan allows
        (`style_relearns_per_day`, then `429 too_many_relearns`). Only owners and editors may start it.
      responses:
        "202":
          description: Learning; the style as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorStyle"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`style_learning_in_progress`: the reference videos are being measured; learn again when that is done."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`too_many_relearns`: the workspace has learnt its style again as often as its plan allows today (UTC)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/style/references/{id}:
    parameters:
      - $ref: "#/components/parameters/AssetIdPath"
    delete:
      operationId: removeStyleReference
      tags: [style]
      summary: Remove a reference video
      description: |
        Deletes the reference video and what was measured from it, and makes the profile again from the others in the background. An
        asset that is not a style reference of this workspace is `404 not_found`. Only owners and editors may remove one.
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/annotations:
    post:
      operationId: createAnnotation
      tags: [annotations]
      summary: Comment on a clip, a render or a version of a timeline
      description: |
        Adds a comment on a range of `target_id`'s time. `target_type` says what that is: `asset` (a clip of the library, `ast_`), `render`
        (an output, `ren_`) or `timeline_version` (a stored version, `tl_`, for a version that has no render yet). A comment on a render
        or a version carries the project and the version it was made on (`project_id`, `timeline_version`), which the server reads from the
        target; `project_id` in the request is optional, and when it is there it must be the target's project (`404` otherwise). A
        point comment has `end_ms` equal to `start_ms`; a range may reach at most 34 ms (one frame) past the end of the clip or render
        when its length is known. `pin` is a point or a box on the frame, normalised to 0..1 from the top left.
        `kind` is `comment` (the default), `instruction`, or one of the constraints `include`, `exclude` and `prefer`. With `parent_id` the
        comment is a reply to a comment: it takes the target and range of that comment, has kind `comment` and no pin, and a reply to a reply is
        refused. `body` is plain text of at most 2,000 characters (a bare marker may have none, except a `comment` or an `instruction`).
        A target or a parent of another workspace is `404 not_found`, the same as one that does not exist. Only owners and editors may
        comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnotationRequest"
      responses:
        "201":
          description: The comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listAnnotations
      tags: [annotations]
      summary: The comments on one target, or on a project
      description: |
        Either `target_type` with `target_id` (the comments on one clip, render or version) or `project_id` (every comment on the renders
        and versions of the project): not both, and one of the two is required. Replies come in the same list, with `parent_id` set. Oldest
        first; page with `cursor` (the `next_cursor` of the previous page). Every role may read.
      parameters:
        - name: target_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AnnotationTargetType"
        - name: target_id
          in: query
          required: false
          description: The TypeID of the target (`ast_`, `ren_` or `tl_` after `target_type`).
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProjectId"
        - name: limit
          in: query
          required: false
          description: How many comments to return (default 200).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAnnotationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/annotations/{id}:
    parameters:
      - $ref: "#/components/parameters/AnnotationIdPath"
    patch:
      operationId: updateAnnotation
      tags: [annotations]
      summary: Edit, resolve or reopen a comment
      description: |
        Changes what the request names and leaves the rest. The author of a comment may change anything; another owner or editor may only
        change `status` (to resolve or reopen it), and the editor's replies are never edited (`403 insufficient_role`). `status` takes `open`
        or `resolved`: `applied` is set by the editor agent when a run has dealt with the comment, and a person reopens it with `open`.
        Editing the text, kind, range or pin of an applied comment reopens it. `remove_pin` takes the pin off. The range of a reply
        cannot be changed (it follows its comment). Editing a comment moves the range of its replies with it. Sending only `start_ms`
        shifts the range and keeps its length (a moment stays a moment); sending only `end_ms` changes the length; send both to set the
        range. A range may reach at most 34 ms (one frame) past the end of the clip or render.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnnotationRequest"
      responses:
        "200":
          description: The comment as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteAnnotation
      tags: [annotations]
      summary: Delete a comment
      description: Soft-deletes the comment and its replies. Only the author may delete a comment (`403 insufficient_role` for anyone else, the editor's replies included).
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PlanRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/webhooks/clerk:
    post:
      operationId: receiveClerkWebhook
      tags: [webhooks]
      summary: Clerk's Svix-signed webhook
      description: |
        Not called by the web app, and not behind a session: the Svix signature is the authentication. It mirrors users,
        organizations and memberships into Postgres, idempotently and in an order-safe way (the `svix-id` of an applied
        delivery is recorded, so a replay changes nothing). The nine events it handles are listed in the setup guide
        (docs/06, section 3.2). It answers 2xx for everything it understood, 400 for a bad signature, and 5xx when
        Postgres or Clerk's Backend API failed, which makes Svix retry.
      security: []
      parameters:
        - name: svix-id
          in: header
          required: true
          description: The delivery id (also accepted as `webhook-id`).
          schema:
            type: string
        - name: svix-timestamp
          in: header
          required: true
          description: Unix seconds. A signature older than five minutes is refused.
          schema:
            type: string
        - name: svix-signature
          in: header
          required: true
          description: The Svix signature of the exact request body.
          schema:
            type: string
      requestBody:
        required: true
        description: Clerk's event, at most 1 MiB. It is verified as raw bytes before it is parsed.
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Understood. `status` says what happened to the delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "400":
          description: "`invalid_signature` or `invalid_event`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "`payload_too_large`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "`webhook_not_configured` (no CLERK_WEBHOOK_SECRET), `identity_unavailable` or `queue_not_migrated`. Svix retries."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Clerk session token (a JWT) for a user acting in an organization, which is the workspace of the request. It must
        verify against the instance's keys, be unexpired, and have `azp` equal to the web app's origin. The workspace id is
        taken from the token's organization and never from request input.

  parameters:
    AssetIdPath:
      name: id
      in: path
      required: true
      description: The asset's TypeID.
      schema:
        $ref: "#/components/schemas/AssetId"

    ProjectIdPath:
      name: id
      in: path
      required: true
      description: The project's TypeID.
      schema:
        $ref: "#/components/schemas/ProjectId"

    AnnotationIdPath:
      name: id
      in: path
      required: true
      description: The annotation's TypeID.
      schema:
        $ref: "#/components/schemas/AnnotationId"

    RenderIdPath:
      name: id
      in: path
      required: true
      description: The render's TypeID.
      schema:
        $ref: "#/components/schemas/RenderId"

    RunIdPath:
      name: id
      in: path
      required: true
      description: The run's TypeID.
      schema:
        $ref: "#/components/schemas/RunId"

  responses:
    Unauthenticated:
      description: |
        No token (`unauthenticated`) or a token that failed verification (`invalid_token`). Sent with
        `WWW-Authenticate: Bearer`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PlanRequired:
      description: The workspace has no active plan (`plan_required`). The web app shows the paywall and fetches `/v1/me` again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Signed in, but not allowed: `no_active_workspace` (no organization is active), `user_deleted`, `workspace_deleted`,
        `not_a_member` (removed from the workspace) or `insufficient_role` (a viewer tried to change something).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: "`invalid_request`: the body, a parameter or an id is not valid."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        `not_found`: no such thing in this workspace. An id that belongs to another workspace is indistinguishable from one
        that does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UploadConflict:
      description: |
        `upload_not_active` (the upload is already completed, aborted or failed) or `upload_expired` (its 24 hours are up).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "`internal_error`. Logged on the server; nothing about the cause is in the body."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: |
        `identity_unavailable` (Clerk's API or key set did not answer), `auth_not_configured` (no CLERK_SECRET_KEY on the
        server) or `queue_not_migrated` (River's tables are missing, so a new workspace cannot be created), `storage_not_configured` (no
        R2_* settings on the server) or `storage_unavailable` (object storage did not answer). Try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ── Errors ──────────────────────────────────────────────────────────────────

    ErrorCode:
      type: string
      description: |
        The stable error codes of the API. The web client branches on these; new ones may be added, so treat an unknown
        code as a generic failure of its HTTP status.
      enum:
        - invalid_request # 400: the server could not bind the request, or a body, parameter or id is not valid
        - unauthenticated # 401: no token
        - invalid_token # 401: the token failed verification (signature, expiry, issuer, azp)
        - plan_required # 402: the workspace has no active plan
        - credits_exhausted # 402: the workspace does not have enough credits for the action (a new edit run); GET /v1/me has the balance
        - no_active_workspace # 403: signed in, but no organization is active
        - user_deleted # 403
        - workspace_deleted # 403
        - not_a_member # 403: removed from the workspace
        - origin_not_allowed # 403: a CORS preflight from an origin other than APP_BASE_URL (no CORS headers)
        - invalid_signature # 400: webhook, the Svix signature is not valid
        - invalid_event # 400: webhook, the body could not be read
        - payload_too_large # 413: webhook
        - internal_error # 500
        - identity_unavailable # 503: Clerk's Backend API or key set did not answer
        - auth_not_configured # 503: no CLERK_SECRET_KEY
        - queue_not_migrated # 503: River's tables are missing
        - webhook_not_configured # 503: no CLERK_WEBHOOK_SECRET
        - insufficient_role # 403: a viewer tried to change something
        - not_found # 404: no such thing in this workspace
        - upload_not_active # 409: the upload is completed, aborted or failed
        - upload_expired # 409: the upload's 24 hours are up
        - file_too_large # 413
        - unsupported_content_type # 415
        - parts_mismatch # 422: the parts sent do not match what object storage holds
        - size_mismatch # 422: the stored object is not the declared size
        - too_many_uploads # 429: 25 uploads are already in progress
        - storage_unavailable # 503: object storage did not answer
        - storage_not_configured # 503: no R2_* settings
        - assets_not_usable # 422: a project's asset is not ready, or is an image
        - version_conflict # 409: the timeline moved on since base_version
        - invalid_ops # 422: an edit batch was refused (see its issues)
        - no_change # 422: an edit batch changed nothing
        - timeline_invalid # 422: a timeline version cannot be rendered (it does not validate against the footage now)
        - too_many_renders # 429: the workspace already has 5 renders waiting or running
        - run_in_progress # 409: the project already has an editor run that has not finished
        - run_not_waiting # 409: the run is not waiting for an answer
        - model_not_configured # 503: the server has no model access (ANTHROPIC_API_KEY or LLM_MODE) or no such routing profile
        - edit_not_charged # 422: a final render needs an edit of the project that was charged (run the editor first)
        - too_many_uncharged_runs # 429: the workspace has had its day's editor runs that spent money and ended without a charge (see startEdit)
        - byok_key_required # 402: the plan uses the workspace's own Anthropic key (BYOK) and none is set up, so no model run can start
        - version_not_charged # 422: a final render of a version that contains editor work that was not charged (a failed or released run)
        - too_many_references # 409: the workspace has its 10 style references already
        - style_learning_in_progress # 409: the style is being learnt already (learn again when it is done)
        - too_many_relearns # 429: the workspace has learnt its style again as often as its plan allows today
        - style_reference # 409: the asset is a style reference; remove it with DELETE /v1/style/references/{id}

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: For people. It may change; do not branch on it.

    Error:
      type: object
      description: The error body of every endpoint.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    # ── TypeIDs (D-24) ──────────────────────────────────────────────────────────
    # A lowercase prefix, an underscore, and a UUIDv7 in 26 characters of Crockford base32 (the first one is 0 to 7).
    # One schema per kind, so a client cannot pass a UserId where a WorkspaceId belongs. A new table adds its prefix here
    # and to the decision's table.

    WorkspaceId:
      type: string
      pattern: "^wks_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      examples: [wks_01j9z3x7m8c4v6n2q5r0t1y8ab]
    UserId:
      type: string
      pattern: "^usr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      examples: [usr_01j9z3x7m8c4v6n2q5r0t1y8ab]
    AssetId:
      type: string
      pattern: "^ast_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    MomentId:
      type: string
      pattern: "^mom_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    ShotId:
      type: string
      pattern: "^shot_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    AnnotationId:
      type: string
      pattern: "^ann_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    TrendId:
      type: string
      pattern: "^trd_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    ConceptId:
      type: string
      pattern: "^con_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    IdeaId:
      type: string
      pattern: "^ide_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    ProjectId:
      type: string
      pattern: "^prj_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    TimelineId:
      type: string
      pattern: "^tl_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    RenderId:
      type: string
      pattern: "^ren_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    RunId:
      type: string
      pattern: "^run_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    ExportId:
      type: string
      pattern: "^exp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    LicenceId:
      type: string
      pattern: "^lic_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    UploadId:
      type: string
      pattern: "^upl_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    EventId:
      type: string
      pattern: "^evt_[0-7][0-9a-hjkmnp-tv-z]{25}$"

    # ── Account and workspace ───────────────────────────────────────────────────

    Role:
      type: string
      description: The caller's role in the workspace. Clerk's `org:admin` is `owner`, `org:member` is `editor`, any other role is `viewer`.
      enum: [owner, editor, viewer]

    PlanName:
      type: string
      description: "The plans. `none` is no plan: the paywall."
      enum: [none, trial, studio, creator, pro]

    PlanStatus:
      type: string
      description: |
        The state of the workspace's plan record. `none` means the workspace never had a plan; `unknown` means the API
        could not read it (never active).
      enum: [active, past_due, canceled, none, unknown]

    PlanSource:
      type: string
      description: Who set the plan. `none` when the workspace never had one.
      enum: [manual, merchant, none]

    AiBilling:
      type: string
      description: |
        Who pays for the model calls (D-18): `managed` (we do) or `byok` (the creator's own key). Empty when the workspace
        has no active plan.
      enum: [managed, byok, ""]

    Entitlements:
      type: object
      description: The plan of the workspace as the API shows it.
      required: [plan, status, active, current_period_end]
      properties:
        plan:
          $ref: "#/components/schemas/PlanName"
        status:
          $ref: "#/components/schemas/PlanStatus"
        active:
          type: boolean
          description: The paywall looks at this and nothing else.
        current_period_end:
          type: [string, "null"]
          format: date-time
          description: "When the paid period ends. `null` means the plan does not end (or there is none)."

    PlanLimits:
      type: object
      description: What the plan includes. A zero number means "not included"; all zero without an active plan.
      required: [exports, storage_gb, ai_billing]
      properties:
        exports:
          type: integer
          minimum: 0
          description: Exported videos per month (the trial's two are in total, not per month).
        storage_gb:
          type: integer
          minimum: 0
        ai_billing:
          $ref: "#/components/schemas/AiBilling"

    MeUser:
      type: object
      description: The signed-in user.
      required: [id, email]
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        email:
          type: string

    MeWorkspace:
      type: object
      description: The active workspace (the Clerk organization of the session) and the caller's role in it.
      required: [id, name, role]
      properties:
        id:
          $ref: "#/components/schemas/WorkspaceId"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    MeResponse:
      type: object
      required: [user, workspace, entitlements]
      properties:
        user:
          $ref: "#/components/schemas/MeUser"
        workspace:
          $ref: "#/components/schemas/MeWorkspace"
        entitlements:
          $ref: "#/components/schemas/Entitlements"
        credits:
          $ref: "#/components/schemas/Credits"

    CreditTopUp:
      type: object
      description: Credits that are not the period's allowance (bought or given) and when they expire.
      required: [credits, expires_at]
      properties:
        credits:
          type: integer
          minimum: 1
          description: What is left of this top-up.
        expires_at:
          type: string
          format: date-time

    Credits:
      type: object
      description: |
        The workspace's credits (1 video = 10 credits). Credits in use by a run that has not finished are already taken out of
        `available`. Allowance that is not used by the end of its period expires; top-ups last 12 months. The allowance is used first,
        then the top-ups, earliest expiry first.
      required: [available, allowance, period_end, low, top_ups]
      properties:
        available:
          type: integer
          minimum: 0
          description: What a new action can use now, allowance and top-ups together.
        allowance:
          type: integer
          minimum: 0
          description: The size of the current period's allowance; 0 when the workspace has none.
        period_end:
          type: [string, "null"]
          format: date-time
          description: When the current allowance expires and the next is granted. `null` when there is none, or it does not end (a trial's).
        low:
          type: boolean
          description: At least 80 % of the allowance is used (`available` is at most a fifth of `allowance`). Always false without an allowance.
        top_ups:
          type: array
          items:
            $ref: "#/components/schemas/CreditTopUp"

    WorkspacePlanResponse:
      description: The entitlements, flattened, plus where the plan came from and what it includes.
      allOf:
        - $ref: "#/components/schemas/Entitlements"
        - type: object
          required: [source, limits]
          properties:
            source:
              $ref: "#/components/schemas/PlanSource"
            limits:
              $ref: "#/components/schemas/PlanLimits"

    LibrarySummaryResponse:
      type: object
      required: [assets, projects]
      properties:
        assets:
          type: integer
          minimum: 0
        projects:
          type: integer
          minimum: 0

    # ── Assets and uploads ──────────────────────────────────────────────────────

    AssetKind:
      type: string
      enum: [video, audio, image]
    AssetPurpose:
      type: string
      description: |
        What an asset is for: `footage` (a clip the editor may cut, the default) or `style_reference` (one of the creator's own
        finished videos, uploaded only so that their style can be learnt: never listed with the footage, never used in a project).
      enum: [footage, style_reference]
    AssetStatus:
      type: string
      description: |
        `uploading` (the multipart upload is in progress), `uploaded` (the object is complete; ingest is queued),
        `processing` (the ingest is running: see `ingest_progress`), `ready` (probed, with its derivatives), or `failed`
        (see `failure_reason`).
      enum: [uploading, uploaded, processing, ready, failed]

    TitleSource:
      type: string
      description: |
        Where the title came from: `filename` (the file name without its extension, what the upload made), `quicklook`
        (written by the quick look) or `user` (edited with `updateAsset`; never overwritten).
      enum: [filename, quicklook, user]

    QuickLookStatus:
      type: string
      description: |
        `pending` (the clip is ready and its quick look has not finished), `succeeded` (title, description and tags were
        written), `failed` (the clip is usable but has no description or tags; the title is still the file name) or
        `skipped` (nothing is owed: the asset failed its ingest, or the job could not run for a day).
      enum: [pending, succeeded, failed, skipped]

    UpdateAssetRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 1024
          description: The new title. Cleaned by the server; 1 to 255 characters must remain.

    Asset:
      type: object
      required: [id, kind, status, filename, content_type, size_bytes, sha256, title, description, tags, failure_reason, ingest_progress, ingest_stage, transcript_status, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/AssetId"
        kind:
          $ref: "#/components/schemas/AssetKind"
        purpose:
          $ref: "#/components/schemas/AssetPurpose"
          description: Present on every asset the server returns (optional in the schema only so older clients and fixtures still type-check).
        status:
          $ref: "#/components/schemas/AssetStatus"
        filename:
          type: string
          description: The file's name as the server stored it (a path and control characters removed, at most 255 bytes).
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: [string, "null"]
          description: The SHA-256 (lowercase hex) the client claimed when it started the upload. Null when it did not say. Not verified by the upload itself.
        title:
          type: string
          description: Editable with `updateAsset`. Starts as the file name without its extension; the quick look replaces it unless it was edited.
        title_source:
          $ref: "#/components/schemas/TitleSource"
          description: Present on every asset the server returns (optional in the schema only so older clients and fixtures still type-check).
        description:
          type: string
          description: A one-line description written by the quick look (at most 160 characters). Empty until then.
        tags:
          type: array
          items:
            type: string
          description: At most 8 lowercase tags of one to three words, written by the quick look. Empty until then.
        quick_look_status:
          $ref: "#/components/schemas/QuickLookStatus"
          description: The state of the quick look (the title, description and tags a video gets right after its ingest). Absent for an asset it does not apply to (audio, images, and videos from before it existed).
        failure_reason:
          type: [string, "null"]
          description: |
            Why the asset is `failed`, as a code that is safe to show. The upload failed: `upload_expired`, `size_mismatch`,
            `upload_aborted`. The ingest could not process the file: `unsupported_format` (not a container we accept),
            `corrupt_media` (damaged or cut off), `no_video_stream`, `no_audio_stream`, `undecodable_video`,
            `invalid_duration`, `too_long` (over 30 minutes), `unsupported_resolution`, `kind_mismatch`; or, our fault, the
            ingest failed on every retry: `processing_failed`, `processing_timeout` (it ran out of time) or
            `processing_interrupted` (the worker was stopped on the last attempt). A failed asset has no derivatives.
            Null otherwise.
        ingest_progress:
          type: integer
          minimum: 0
          maximum: 100
          description: How far the ingest is while `status` is `processing`; 100 when `ready`, 0 before it starts.
        ingest_stage:
          type: [string, "null"]
          description: What the ingest is doing while `status` is `processing` (`starting`, `downloading`, `probing`, `proxy`, `derivatives`, `uploading`). Null otherwise.
        transcript_status:
          $ref: "#/components/schemas/TranscriptStatus"
        transcript_failure_reason:
          type: [string, "null"]
          description: |
            Why the transcript is `failed`, as a code that is safe to show: `spend_cap` (the workspace's daily spend cap could not
            cover the transcription), `minutes_cap` (the workspace had its daily minutes of transcription already),
            `unusable_audio`, `gave_up` (every attempt failed). Null otherwise. Absent on older responses.
        media:
          $ref: "#/components/schemas/MediaInfo"
        derivatives:
          $ref: "#/components/schemas/AssetDerivatives"
        derivative_urls_expire_at:
          type: string
          format: date-time
          description: When the URLs in `derivatives` stop working. Present with `derivatives`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TranscriptStatus:
      type: string
      description: |
        Where the transcript of the asset stands. `none`: there is none and none is coming (a picture, a clip without an audio
        track, or the ingest has not finished). `pending`: the transcription job is queued or running. `no_speech`: the clip was
        checked and has no speech. `ready`: the words are available at `GET /v1/assets/{id}/transcript`. `failed`: the job gave up.
      enum: [none, pending, no_speech, ready, failed]

    Transcript:
      type: object
      required: [asset_id, status, speech, language, words, structure, provider, model, audio_ms, speech_ms, created_at, updated_at]
      properties:
        asset_id:
          $ref: "#/components/schemas/AssetId"
        status:
          $ref: "#/components/schemas/TranscriptStatus"
        speech:
          type: boolean
          description: False when the voice-activity check found no speech; `words` is then empty.
        language:
          type: string
          description: The spoken language as an ISO 639-1 code (`en`, `nl`); empty without speech.
        words:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptWord"
        structure:
          $ref: "#/components/schemas/SpeechStructure"
        provider:
          type: string
          description: Who transcribed it (`whispercpp`, `workersai`). The words have the same shape whichever it was.
        model:
          type: string
        audio_ms:
          type: integer
          format: int64
          description: The length of the audio that was checked.
        speech_ms:
          type: integer
          format: int64
          description: How much speech the voice-activity check found.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TranscriptWord:
      type: object
      required: [text, start_ms, end_ms, confidence]
      properties:
        text:
          type: string
          description: The word as written, with its punctuation (`Hello,`).
        start_ms:
          type: integer
          format: int64
          description: Milliseconds from the start of the asset. Placed on the audio itself, not only on the model's estimate.
        end_ms:
          type: integer
          format: int64
        confidence:
          type: number
          format: double
          description: The model's probability for the word, 0 to 1; 0 when the provider does not report one.

    SpeechStructure:
      type: object
      description: |
        Derived from the words (so it is the same for every provider): where sentences end, which words are fillers, where the
        speaker pauses. Word indexes are positions in `words`.
      required: [sentences, fillers, pauses]
      properties:
        sentences:
          type: array
          items:
            $ref: "#/components/schemas/SpeechSentence"
        fillers:
          type: array
          items:
            $ref: "#/components/schemas/SpeechFiller"
        pauses:
          type: array
          description: Silences between two words that last longer than 400 ms.
          items:
            $ref: "#/components/schemas/SpeechPause"

    SpeechSentence:
      type: object
      required: [first_word, last_word, start_ms, end_ms, text]
      properties:
        first_word:
          type: integer
        last_word:
          type: integer
          description: Included.
        start_ms:
          type: integer
          format: int64
        end_ms:
          type: integer
          format: int64
        text:
          type: string

    SpeechFiller:
      type: object
      required: [first_word, last_word, start_ms, end_ms, text, kind, strength]
      properties:
        first_word:
          type: integer
        last_word:
          type: integer
          description: Included; a phrase such as "you know" spans two words.
        start_ms:
          type: integer
          format: int64
        end_ms:
          type: integer
          format: int64
        text:
          type: string
        kind:
          type: string
          enum: [hesitation, discourse]
          description: "`hesitation` is a sound without meaning (um, uh, eh); `discourse` is a word or phrase that is empty here but a word elsewhere (like, you know, zeg maar)."
        strength:
          type: string
          enum: [strong, weak]
          description: "`strong` fillers are nearly always safe to cut; `weak` ones depend on context."

    SpeechPause:
      type: object
      required: [after_word, start_ms, end_ms, duration_ms, sentence_break]
      properties:
        after_word:
          type: integer
          description: The index of the word before the pause.
        start_ms:
          type: integer
          format: int64
        end_ms:
          type: integer
          format: int64
        duration_ms:
          type: integer
          format: int64
        sentence_break:
          type: boolean
          description: True when the pause falls between two sentences, false when the speaker stopped mid-sentence.

    MediaInfo:
      type: object
      description: What the ingest probe found in the original. Present once the asset is `ready`.
      required: [duration_ms, width, height, fps, rotation, video_codec, audio_codec, has_audio, hdr]
      properties:
        duration_ms:
          type: integer
          format: int64
          description: 0 for an image.
        width:
          type: [integer, "null"]
          description: The upright (display) width of the original in pixels, rotation applied. Null for audio.
        height:
          type: [integer, "null"]
          description: The upright (display) height. A phone clip held upright is portrait here although it is stored sideways.
        fps:
          type: [number, "null"]
          format: double
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
          description: Degrees clockwise the stored picture of the original must turn to be upright. The derivatives have it applied already and carry no rotation flag.
        video_codec:
          type: [string, "null"]
        audio_codec:
          type: [string, "null"]
          description: The codec of the audio stream that was used. A file's other audio tracks that cannot be decoded (the APAC spatial-audio track of an iPhone clip) are ignored.
        has_audio:
          type: boolean
          description: True when a decodable audio stream was found and is in the proxy.
        hdr:
          type: boolean
          description: True when the original is HDR (PQ or HLG). The proxy is always SDR BT.709.

    DerivativeFile:
      type: object
      required: [url, content_type, size_bytes]
      properties:
        url:
          type: string
          description: A presigned GET URL. It supports HTTP range requests. Treat it as a secret until it expires.
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        width:
          type: integer
          description: Pixels, for pictures and videos.
        height:
          type: integer
        duration_ms:
          type: integer
          format: int64

    AssetDerivatives:
      type: object
      description: |
        The files the ingest made, each as a short-lived presigned GET URL. Only the files that exist are present: an
        audio file has no picture files, and a clip without a decodable audio track has no `waveform`.
      properties:
        proxy_720:
          allOf:
            - $ref: "#/components/schemas/DerivativeFile"
          description: "`proxy_720.mp4`: H.264, 720 px on the short side (a portrait clip is 720x1280), upright with no rotation flag, SDR BT.709, a keyframe every second, the index first, AAC audio. Plays and seeks in a plain `<video>`."
        poster:
          allOf:
            - $ref: "#/components/schemas/DerivativeFile"
          description: "`poster.jpg`: a representative frame."
        hover_preview:
          allOf:
            - $ref: "#/components/schemas/DerivativeFile"
          description: "`hover_preview.mp4`: about 8 s made of four 2 s segments spread over the clip (the whole clip when it is shorter), muted, 360 px on the short side, under 1 MB."
        sprite:
          allOf:
            - $ref: "#/components/schemas/DerivativeFile"
          description: "`sprite.jpg`: a grid of 160 px wide tiles, one per `interval_sec` seconds (at most 100), for hover scrubbing. `sprite_vtt` says where each tile is."
        sprite_vtt:
          allOf:
            - $ref: "#/components/schemas/DerivativeFile"
          description: "`sprite.vtt` as stored: a WebVTT thumbnails track whose cues name the sheet relatively (`sprite.jpg#xywh=x,y,w,h`). Do not give this URL to a player; `GET /v1/assets/{id}/sprite.vtt` returns the same track with every cue pointing at the sprite URL."
        waveform:
          allOf:
            - $ref: "#/components/schemas/DerivativeFile"
          description: "`waveform.json`: `{version, sample_rate, duration_ms, samples_per_peak, peaks}`, up to 1000 peaks from 0 to 1."

    CreateAssetRequest:
      type: object
      required: [filename, size_bytes, content_type]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 1024
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 21474836480
          description: The exact size of the file. At most 20 GB. The upload only completes when the stored object has exactly this size.
        content_type:
          type: string
          maxLength: 255
          description: "`video/mp4`, `video/quicktime`, `video/webm`, `audio/*`, `image/jpeg`, `image/png` or `image/heic`."
        sha256:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
          description: Optional SHA-256 of the file, in hex.
        purpose:
          $ref: "#/components/schemas/AssetPurpose"
          description: "`style_reference` for one of the creator's finished videos uploaded as a style reference; the default is `footage`."

    UploadStatus:
      type: string
      description: |
        `active` (parts can be uploaded), `completed`, `aborted` (by the client or by the clean-up job) or `expired` (past
        `expires_at`, not cleaned up yet).
      enum: [active, completed, aborted, expired]

    UploadInfo:
      type: object
      required: [id, asset_id, status, part_size, part_count, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/UploadId"
        asset_id:
          $ref: "#/components/schemas/AssetId"
        status:
          $ref: "#/components/schemas/UploadStatus"
        part_size:
          type: integer
          format: int64
          description: Bytes in every part but the last, which holds the rest.
        part_count:
          type: integer
          description: Part numbers run from 1 to this.
        expires_at:
          type: string
          format: date-time
          description: After this the upload can no longer be completed, and it is aborted.

    PartUrl:
      type: object
      required: [part_number, url, size_bytes]
      properties:
        part_number:
          type: integer
          minimum: 1
        url:
          type: string
          description: A presigned URL. `PUT` exactly `size_bytes` bytes to it; the `ETag` response header is the part's ETag. Treat it as a secret.
        size_bytes:
          type: integer
          format: int64
          description: The exact Content-Length the URL is signed for.

    CreateAssetResponse:
      type: object
      required: [asset, upload, parts, urls_expire_at]
      properties:
        asset:
          $ref: "#/components/schemas/Asset"
        upload:
          $ref: "#/components/schemas/UploadInfo"
        parts:
          type: array
          description: Presigned URLs for the first parts (up to 20).
          items:
            $ref: "#/components/schemas/PartUrl"
        urls_expire_at:
          type: string
          format: date-time

    PresignPartsRequest:
      type: object
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            minimum: 1
            maximum: 10000

    PresignPartsResponse:
      type: object
      required: [parts, urls_expire_at]
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/PartUrl"
        urls_expire_at:
          type: string
          format: date-time

    UploadedPart:
      type: object
      description: A part object storage holds.
      required: [part_number, etag, size_bytes]
      properties:
        part_number:
          type: integer
          minimum: 1
        etag:
          type: string
        size_bytes:
          type: integer
          format: int64

    UploadStateResponse:
      type: object
      required: [upload, completed_parts]
      properties:
        upload:
          $ref: "#/components/schemas/UploadInfo"
        completed_parts:
          type: array
          items:
            $ref: "#/components/schemas/UploadedPart"

    CompletedPartRef:
      type: object
      required: [part_number, etag]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
          maxLength: 128

    CompleteAssetRequest:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/CompletedPartRef"

    ListAssetsResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        next_cursor:
          type: [string, "null"]
          description: Pass it as `cursor` for the next page. Null on the last page.

    # ── Projects and timelines ──────────────────────────────────────────────────

    ProjectFormat:
      type: string
      description: The output format (D-25). It fixes the size of the rendered video (1080x1920, 1080x1080, 1080x1350, 1920x1080).
      enum: ["9:16", "1:1", "4:5", "16:9"]

    ProjectStatus:
      type: string
      enum: [draft, editing, review, approved, exported]

    AuthorKind:
      type: string
      enum: [user, agent]

    CreateProjectRequest:
      type: object
      required: [format, asset_ids]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Defaults to "Untitled project".
        format:
          $ref: "#/components/schemas/ProjectFormat"
        asset_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: The footage the editor may use, in order. Each must be a `ready` video or audio asset of this workspace.
          items:
            $ref: "#/components/schemas/AssetId"
        brief:
          type: string
          maxLength: 4000
          description: The creator's instructions, free text.

    ProjectAsset:
      type: object
      required: [asset_id, position, title, kind, status, duration_ms, available]
      properties:
        asset_id:
          $ref: "#/components/schemas/AssetId"
        position:
          type: integer
          minimum: 0
        title:
          type: string
        kind:
          $ref: "#/components/schemas/AssetKind"
        status:
          $ref: "#/components/schemas/AssetStatus"
        duration_ms:
          type: [integer, "null"]
          format: int64
        available:
          type: boolean
          description: False when the asset was deleted or is no longer `ready`; the editor cannot use it then.

    TimelineVersionSummary:
      type: object
      required: [id, version, parent_version, author_kind, author_id, summary, created_at]
      properties:
        id:
          $ref: "#/components/schemas/TimelineId"
        version:
          type: integer
          minimum: 1
        parent_version:
          type: [integer, "null"]
          description: The version this one was made from. Null for version 1.
        author_kind:
          $ref: "#/components/schemas/AuthorKind"
        author_id:
          type: string
          description: |
            For `user`, the TypeID of the user (`usr_...`). For `agent`, the TypeID of the editor run (`run_...`) that made the
            version; `GET /v1/runs/{id}` shows the run. (The key that makes a repeated tool call idempotent is stored apart from it.)
        summary:
          type: array
          description: One line per change, for the version list and the run feed.
          items:
            type: string
        created_at:
          type: string
          format: date-time

    ProjectSummary:
      type: object
      required: [id, title, format, status, asset_count, current_timeline_version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ProjectId"
        title:
          type: string
        format:
          $ref: "#/components/schemas/ProjectFormat"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        asset_count:
          type: integer
          minimum: 0
        current_timeline_version:
          type: [integer, "null"]
          description: Null until the first edit.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Project:
      type: object
      required: [id, title, format, brief, status, asset_count, current_timeline_version, current_version, assets, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ProjectId"
        title:
          type: string
        format:
          $ref: "#/components/schemas/ProjectFormat"
        brief:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        asset_count:
          type: integer
          minimum: 0
          description: The footage that is not deleted (`assets` also lists an asset deleted since, with `available` false). The list shows the same count.
        current_timeline_version:
          type: [integer, "null"]
          description: Null until the first edit creates version 1.
        current_version:
          oneOf:
            - $ref: "#/components/schemas/TimelineVersionSummary"
            - type: "null"
        assets:
          type: array
          description: The footage, in the order the creator chose.
          items:
            $ref: "#/components/schemas/ProjectAsset"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListProjectsResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        next_cursor:
          type: [string, "null"]
          description: Pass it as `cursor` for the next page. Null on the last page.

    ListTimelineVersionsResponse:
      type: object
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TimelineVersionSummary"
        next_before:
          type: [integer, "null"]
          description: Pass it as `before` for the next page. Null on the last page.

    TimelineIssue:
      type: object
      description: One finding of validating a timeline spec (docs/design/timeline-v1.md, section 3).
      required: [code, path, message, severity]
      properties:
        code:
          type: string
          description: "`schema`, `duplicate_id`, `gap`, `overlap`, `source_out_of_range`, `unknown_asset`, ..."
        path:
          type: string
          description: A JSON Pointer into the spec. Empty for the whole document.
        message:
          type: string
        severity:
          type: string
          enum: [error, warning]

    OpIssue:
      type: object
      description: One problem with an edit batch. It names the op that caused it when that is known.
      required: [op_index, code, message, severity]
      properties:
        op_index:
          type: integer
          description: The index in the batch of the op that caused the issue, -1 when no op in particular did.
        op:
          type: string
          description: The name of that op.
        code:
          type: string
          description: "An op code (`invalid_op`, `unknown_op`, `unknown_item`, `bad_position`, `id_taken`, ...) or a timeline code (`unknown_asset`, `shot_too_short`, ...)."
        field:
          type: string
          description: A JSON Pointer into the op, for a problem with the op itself.
        path:
          type: string
          description: A JSON Pointer into the resulting spec, for a problem the validator found.
        message:
          type: string
        severity:
          type: string
          enum: [error, warning]

    CreatedItem:
      type: object
      description: An item an `add_*` or `set_sound` op made, with the id it got.
      required: [op_index, kind, id]
      properties:
        op_index:
          type: integer
        kind:
          type: string
          enum: [clip, text, sound]
        id:
          type: string

    TimelineVersion:
      allOf:
        - $ref: "#/components/schemas/TimelineVersionSummary"
        - type: object
          required: [spec, ops, diff, issues]
          properties:
            spec:
              type: object
              description: The timeline, as defined by `packages/schemas/timeline/v1.schema.json`.
              additionalProperties: true
              x-go-type: rawjson.RawMessage
              x-go-type-import:
                path: encoding/json
                name: rawjson
            ops:
              type: array
              description: The batch that made this version from its parent. Empty for version 1 when it did not come from ops.
              items:
                type: object
                additionalProperties: true
              x-go-type: rawjson.RawMessage
              x-go-type-import:
                path: encoding/json
                name: rawjson
            diff:
              type: array
              description: The RFC 6902 JSON Patch from the parent's spec to this one's.
              items:
                type: object
                additionalProperties: true
              x-go-type: rawjson.RawMessage
              x-go-type-import:
                path: encoding/json
                name: rawjson
            issues:
              type: array
              description: What validating the spec against the project's footage finds now. Empty for a clean version.
              items:
                $ref: "#/components/schemas/TimelineIssue"

    ApplyTimelineOpsRequest:
      type: object
      required: [base_version, ops]
      properties:
        base_version:
          type: integer
          minimum: 0
          description: The version the ops are meant for; 0 when the project has no timeline yet.
        ops:
          type: array
          minItems: 1
          maxItems: 100
          description: The edit ops, each an object with an `op` field (see `ops.v1.schema.json`). They are checked strictly.
          items:
            type: object
            additionalProperties: true
          x-go-type: rawjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: rawjson

    ApplyTimelineOpsResponse:
      type: object
      required: [version, created, warnings]
      properties:
        version:
          $ref: "#/components/schemas/TimelineVersion"
        created:
          type: array
          items:
            $ref: "#/components/schemas/CreatedItem"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/OpIssue"

    OpsRejected:
      type: object
      description: The error body of a batch that was refused. `issues` says why, op by op.
      required: [error, issues]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/OpIssue"

    # ── Agent runs ──────────────────────────────────────────────────────────────

    RunProfile:
      type: string
      description: |
        A model routing profile (config/routing): `dev-cheap` (Haiku, cents per run), `dev-mid` or `v1-start` (the editor on Opus).
      enum: [dev-cheap, dev-mid, v1-start]

    StartEditRequest:
      type: object
      properties:
        instructions:
          type: string
          maxLength: 2000
          description: Extra instructions for this run, in the creator's words. Data for the model, not commands.
        profile:
          $ref: "#/components/schemas/RunProfile"
        vibe:
          $ref: "#/components/schemas/EditVibe"
        budget_usd:
          type: number
          exclusiveMinimum: 0
          description: Ignored. The run's spend cap is set by the server from the plan (it used to be the caller's, up to $5).

    EditVibe:
      type: string
      enum: [calm, lively, hype]
      description: |
        The energy of the edit (P6-06). The creator's style still decides the colours, the fonts, the title's look and place and the
        rough shot length; the vibe decides how much moves: `calm` stays close to the creator's own restraint (hard cuts, a quiet
        title), `lively` puts transitions on the strong beats and the drop, gives every text an entrance and an exit and keeps the
        camera moving, `hype` does that on more beats with faster shots. A run without one uses the workspace's
        (`GET /v1/style`, `effective.vibe`; `lively` when nothing is set).

    ReplyRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: The answer to the run's question.

    RunStatus:
      type: string
      enum: [queued, running, waiting_input, succeeded, failed, cancelled]

    RunEventType:
      type: string
      enum: [status, assistant_message, tool_call, tool_result, error, artifact]

    RunEvent:
      type: object
      description: One step of a run, as a line of text.
      required: [seq, type, text, created_at]
      properties:
        seq:
          type: integer
          description: The event's place in the run, from 1.
        type:
          $ref: "#/components/schemas/RunEventType"
        text:
          type: string
          description: One line, at most 400 bytes. Text a model or a tool wrote; show it as text.
        tool:
          type: [string, "null"]
          description: The tool of a `tool_call` or `tool_result`.
        is_error:
          type: boolean
          description: A failed tool call, or an `error` event.
        call_id:
          type: [string, "null"]
          description: |
            The model's tool call id. A `tool_call` and its `tool_result` have the same one, and an `artifact` has the id of the call
            that made it, so pair them by this and not by order. Absent on the other events. An opaque string.
        kind:
          type: [string, "null"]
          description: The kind of an `artifact` event, such as `creative_plan` or `edit_check`; absent on the other events.
        created_at:
          type: string
          format: date-time

    RunArtifact:
      type: object
      description: |
        Something a run's tool recorded. `data` was written by a model or a tool and may quote the creator's own text: untrusted,
        show its strings as text only.
      required: [seq, kind, call_id, data, created_at]
      properties:
        seq:
          type: integer
          description: The artifact event's place in the run (the `seq` of its `RunEvent`).
        kind:
          type: string
          description: |
            What it is: `creative_plan`, `edit_check`, `preview` or `timeline_version` for the editor (see agent-runtime-v1 for each
            one's fields).
        call_id:
          type: [string, "null"]
          description: The tool call that made it (the `call_id` of its `tool_call` and `tool_result` events).
        data:
          type: [object, "null"]
          description: The artifact itself, at most 64 KB; `null` for an artifact event that has none. Its shape depends on `kind`. Untrusted text.
          additionalProperties: true
          x-go-type: rawjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: rawjson
        created_at:
          type: string
          format: date-time

    RunArtifacts:
      type: object
      required: [artifacts, next_after_seq]
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/RunArtifact"
        next_after_seq:
          type: [integer, "null"]
          description: Pass as `after_seq` for the next page; `null` when this is the last page so far (poll again for more).

    RunCredits:
      type: object
      description: |
        What the run costs in credits, from the credit ledger. A run that was released (failed, cancelled before it made anything, or
        found nothing to change) is not charged and has no `credits` object at all.
      required: [state, action, credits]
      properties:
        state:
          type: string
          enum: [held, charged, refunded]
          description: "`held`: set aside while the run works. `charged`: taken. `refunded`: taken, then given back."
        action:
          type: string
          enum: [edit.first, edit.revision]
        credits:
          type: integer
          minimum: 0
          description: How many credits (for `refunded`, how many were given back, which is less than the charge when part of it came from credits that had expired).

    RunTokens:
      type: object
      description: |
        What the run's model calls used. `cache_hit_rate` is `cache_read` over all prompt tokens (`input` + `cache_write` +
        `cache_read`), `null` before the first call.
      required: [input, cache_write, cache_read, output, cache_hit_rate]
      properties:
        input:
          type: integer
          format: int64
        cache_write:
          type: integer
          format: int64
        cache_read:
          type: integer
          format: int64
        output:
          type: integer
          format: int64
        cache_hit_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1

    Run:
      type: object
      required: [id, agent, status, routing_profile, model, effort, billed_to, cost_micros, budget_micros, tokens, tool_calls, budget_tool_calls, active_ms, budget_wall_clock_ms, created_at, events, last_seq]
      properties:
        id:
          $ref: "#/components/schemas/RunId"
        agent:
          type: string
          description: The agent, such as `editor`.
        project_id:
          $ref: "#/components/schemas/ProjectId"
        status:
          $ref: "#/components/schemas/RunStatus"
        failure_reason:
          type: [string, "null"]
          description: |
            Why a `failed` run failed, such as `budget`, `model_error`, `daily_cap` or `internal_error`. `null` otherwise.
        question:
          type: [string, "null"]
          description: The question of a run that is `waiting_input`; answer it with `POST /v1/runs/{id}/reply`.
        summary:
          type: [string, "null"]
          description: The message for the creator that a finished run ended with (for a run that stopped early, why it did).
        timeline_version:
          type: [integer, "null"]
          description: The timeline version the run finished on, for a run that finished the edit.
        routing_profile:
          type: string
        model:
          type: string
        effort:
          type: string
        billed_to:
          type: string
          description: Who pays for the run's model calls (`platform`, `workspace_key` or `test`).
        cost_micros:
          type: integer
          format: int64
          description: What the run's model calls cost at list price, in millionths of a dollar.
        budget_micros:
          type: integer
          format: int64
          description: The run's spend cap, in millionths of a dollar.
        tokens:
          $ref: "#/components/schemas/RunTokens"
        tool_calls:
          type: integer
        budget_tool_calls:
          type: integer
        active_ms:
          type: integer
          format: int64
          description: How long the run has been running (waiting for an answer does not count).
        budget_wall_clock_ms:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        credits:
          description: |
            What the run costs in credits; only on `GET /v1/runs/{id}`, and absent for a run that took none (a released run, a
            run without credits) and for the answers of start, cancel and reply.
          oneOf:
            - $ref: "#/components/schemas/RunCredits"
            - type: "null"
        events:
          type: array
          items:
            $ref: "#/components/schemas/RunEvent"
        last_seq:
          type: integer
          description: The sequence number of the run's last event (not only of the ones returned), 0 before the first.

    # ── Renders ─────────────────────────────────────────────────────────────────

    RenderProfile:
      type: string
      description: "`preview`: half the format's size, from the 720p proxies, x264 veryfast, with the beat guide. `final`: the format's size, from the originals, x264 medium, two-pass loudness."
      enum: [preview, final]

    RenderStatus:
      type: string
      enum: [queued, rendering, ready, failed]

    CreateRenderRequest:
      type: object
      required: [version, profile]
      properties:
        version:
          type: integer
          minimum: 1
          description: The timeline version to render.
        profile:
          $ref: "#/components/schemas/RenderProfile"

    RenderFile:
      type: object
      required: [url, content_type, size_bytes]
      properties:
        url:
          type: string
          description: A presigned GET URL. Treat it as a secret until it expires.
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64

    ContactSheetTile:
      type: object
      required: [index, out_ms, frame, kind]
      properties:
        index:
          type: integer
          minimum: 0
          description: The tile's place in the sheet, row by row, from 0.
        out_ms:
          type: integer
          format: int64
          description: The output time of the frame shown, the timestamp drawn on the tile.
        frame:
          type: integer
          format: int64
          description: The output frame number.
        item_id:
          type: string
          description: The main-track item that owns that time (the shot).
        kind:
          type: string
          enum: [shot, last]
          description: "`shot`: 100 ms after the shot starts (the first shot starts at 0, the others at each cut). `last`: the last frame of the video."

    ContactSheet:
      type: object
      description: |
        The layout of the contact sheet: one tile per shot (the frame 100 ms after the cut that starts it) and the last frame,
        tiled `columns` across, each with its output timestamp (`m:ss.mmm`) drawn on it.
      required: [columns, tile_width, tile_height, tiles]
      properties:
        columns:
          type: integer
        tile_width:
          type: integer
        tile_height:
          type: integer
        tiles:
          type: array
          items:
            $ref: "#/components/schemas/ContactSheetTile"

    RenderFiles:
      type: object
      required: [mp4, contact_sheet, time_map]
      properties:
        mp4:
          $ref: "#/components/schemas/RenderFile"
        contact_sheet:
          $ref: "#/components/schemas/RenderFile"
        time_map:
          allOf:
            - $ref: "#/components/schemas/RenderFile"
          description: "A JSON array of `{out_start_ms, out_end_ms, item_id, asset_id?, source_in_ms?, speed?}`: main items carry the asset, the source in point and the speed, text items the first three fields only. An output time `t` inside an item is the source time `source_in_ms + (t - out_start_ms) * speed`."

    SoundCue:
      type: object
      description: A sound the timeline asks for that is never mixed in (decision D-03); the creator adds it in the app.
      required: [item_id, trend_id, at_ms, source_offset_ms, duration_ms, gain_db]
      properties:
        item_id:
          type: string
        trend_id:
          type: string
          description: The trend's TypeID.
        at_ms:
          type: integer
          format: int64
        source_offset_ms:
          type: integer
          format: int64
        duration_ms:
          type: integer
          format: int64
        gain_db:
          type: number

    RequestedBy:
      type: object
      required: [kind, id]
      properties:
        kind:
          $ref: "#/components/schemas/AuthorKind"
        id:
          type: string
          description: The user's TypeID, or the editor run's id.

    Render:
      type: object
      required: [id, project_id, timeline_version, profile, status, progress, stage, duration_ms, width, height, size_bytes, contact_sheet, sound_cues, files, urls_expires_at, failure_reason, requested_by, created_at, started_at, finished_at]
      properties:
        id:
          $ref: "#/components/schemas/RenderId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        timeline_version:
          type: integer
          minimum: 1
        profile:
          $ref: "#/components/schemas/RenderProfile"
        status:
          $ref: "#/components/schemas/RenderStatus"
        progress:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: [string, "null"]
          description: "What a running render is doing: `staging` (fetching the footage), `measuring` (the loudness pass of the final profile), `rendering`, `contact_sheet`, `uploading`. Null otherwise."
        duration_ms:
          type: [integer, "null"]
          format: int64
          description: The length of the video. Null until ready.
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        size_bytes:
          type: [integer, "null"]
          format: int64
          description: The size of the MP4. Null until ready.
        contact_sheet:
          oneOf:
            - $ref: "#/components/schemas/ContactSheet"
            - type: "null"
        sound_cues:
          type: array
          items:
            $ref: "#/components/schemas/SoundCue"
        files:
          oneOf:
            - $ref: "#/components/schemas/RenderFiles"
            - type: "null"
          description: Null until the render is ready, and in lists (fetch the render itself for the URLs).
        urls_expires_at:
          type: [string, "null"]
          format: date-time
        failure_reason:
          type: [string, "null"]
          description: "When `failed`: `invalid_timeline`, `source_unavailable` (an asset or its proxy is gone), `inputs_too_large`, `render_failed` (ffmpeg could not make the video), `project_deleted`, `job_lost` (the job that should have rendered it was gone), `timeout`, `interrupted` or `processing_failed`."
        requested_by:
          $ref: "#/components/schemas/RequestedBy"
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    ListRendersResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Render"
        next_cursor:
          type: [string, "null"]
          description: Pass it as `cursor` for the next page. Null on the last page.

    # ── The creator's style ─────────────────────────────────────────────────────

    StyleLevel:
      type: string
      description: "`off`, `subtle` (a few, on the strongest moments) or `lots` (on most strong beats)."
      enum: ["off", subtle, lots]
    StyleToggle:
      type: string
      enum: ["off", "on"]
    StyleTitlePosition:
      type: string
      description: "`top` (at the top of the safe area, above the person), `upper_third` (a third of the way down) or `auto` (the editor picks, never on the person)."
      enum: [top, upper_third, auto]
    StyleTitleCase:
      type: string
      description: "`upper` (ALL CAPS), `lower` (all lowercase) or `as_typed`."
      enum: [upper, lower, as_typed]
    StyleMusic:
      type: string
      description: "`always` (every video is cut to music), `when_added` (only when the creator adds a song) or `never`."
      enum: [always, when_added, never]
    StylePace:
      type: string
      description: "`slower`, `like_mine` (like the creator's own videos) or `faster`."
      enum: [slower, like_mine, faster]
    StyleEndingHold:
      type: string
      description: "`long` (the last shot is held clearly longer than the others) or `short` (it is as long as the others)."
      enum: [short, long]
    StyleCutTiming:
      type: string
      description: "`full_reps` (cuts fall at the end of a rep) or `mid_rep` (cuts fall on the beat, also in the middle of a rep)."
      enum: [full_reps, mid_rep]
    StyleSettingSource:
      type: string
      description: |
        Where an effective setting came from: `this_video` (the vibe of one edit), `you` (the creator's own setting), `suggested`
        (the AI's suggestion from the reference videos), `measured` (measured from them), `vibe` (what the vibe asks for) or `default`.
      enum: [this_video, you, suggested, measured, vibe, default]

    StyleSettings:
      type: object
      additionalProperties: false
      description: Settings of the creator's style. A property that is absent is not set.
      properties:
        vibe:
          $ref: "#/components/schemas/EditVibe"
        transitions:
          $ref: "#/components/schemas/StyleLevel"
        text_animation:
          $ref: "#/components/schemas/StyleToggle"
        camera_motion:
          $ref: "#/components/schemas/StyleLevel"
        title_colour:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: The colour of the title's letters, like `#RRGGBB`.
        title_position:
          $ref: "#/components/schemas/StyleTitlePosition"
        title_case:
          $ref: "#/components/schemas/StyleTitleCase"
        music:
          $ref: "#/components/schemas/StyleMusic"
        pace:
          $ref: "#/components/schemas/StylePace"
        chapter_titles:
          $ref: "#/components/schemas/StyleToggle"
        title_template:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            The form of the titles, the words that change as slots in capitals between angle brackets, such as `<TOPIC> <N>` or
            `<N> MOVES FOR <GOAL>`. Letters, digits, spaces, slots and common punctuation.
        ending_hold:
          $ref: "#/components/schemas/StyleEndingHold"
        cut_timing:
          $ref: "#/components/schemas/StyleCutTiming"
        angle_switches:
          $ref: "#/components/schemas/StyleToggle"

    StyleSettingSources:
      type: object
      required: [vibe, transitions, text_animation, camera_motion, title_colour, title_position, title_case, music, pace, chapter_titles, title_template, ending_hold, cut_timing, angle_switches]
      properties:
        vibe:
          $ref: "#/components/schemas/StyleSettingSource"
        transitions:
          $ref: "#/components/schemas/StyleSettingSource"
        text_animation:
          $ref: "#/components/schemas/StyleSettingSource"
        camera_motion:
          $ref: "#/components/schemas/StyleSettingSource"
        title_colour:
          $ref: "#/components/schemas/StyleSettingSource"
        title_position:
          $ref: "#/components/schemas/StyleSettingSource"
        title_case:
          $ref: "#/components/schemas/StyleSettingSource"
        music:
          $ref: "#/components/schemas/StyleSettingSource"
        pace:
          $ref: "#/components/schemas/StyleSettingSource"
        chapter_titles:
          $ref: "#/components/schemas/StyleSettingSource"
        title_template:
          $ref: "#/components/schemas/StyleSettingSource"
        ending_hold:
          $ref: "#/components/schemas/StyleSettingSource"
        cut_timing:
          $ref: "#/components/schemas/StyleSettingSource"
        angle_switches:
          $ref: "#/components/schemas/StyleSettingSource"

    EffectiveStyleSettings:
      type: object
      description: |
        What the editor follows. `title_colour` is `null` when nothing decides it (the editor then uses the title style's own), and
        `title_template` when no form was learnt or set (the editor picks the words).
      required: [vibe, transitions, text_animation, camera_motion, title_colour, title_position, title_case, music, pace, chapter_titles, title_template, ending_hold, cut_timing, angle_switches, sources]
      properties:
        vibe:
          $ref: "#/components/schemas/EditVibe"
        transitions:
          $ref: "#/components/schemas/StyleLevel"
        text_animation:
          $ref: "#/components/schemas/StyleToggle"
        camera_motion:
          $ref: "#/components/schemas/StyleLevel"
        title_colour:
          type: [string, "null"]
        title_position:
          $ref: "#/components/schemas/StyleTitlePosition"
        title_case:
          $ref: "#/components/schemas/StyleTitleCase"
        music:
          $ref: "#/components/schemas/StyleMusic"
        pace:
          $ref: "#/components/schemas/StylePace"
        chapter_titles:
          $ref: "#/components/schemas/StyleToggle"
        title_template:
          type: [string, "null"]
        ending_hold:
          $ref: "#/components/schemas/StyleEndingHold"
        cut_timing:
          $ref: "#/components/schemas/StyleCutTiming"
        angle_switches:
          $ref: "#/components/schemas/StyleToggle"
        sources:
          $ref: "#/components/schemas/StyleSettingSources"

    StyleSummary:
      type: object
      description: |
        The description of the style in plain words, written by a model from the measures and a few frames of the reference videos
        (untrusted model text: show it as text), and the settings it suggests.
      required: [text, suggested, references, prompt_version, written_at]
      properties:
        text:
          type: string
          maxLength: 320
        suggested:
          $ref: "#/components/schemas/StyleSettings"
        references:
          type: integer
          minimum: 0
          description: How many reference videos it was written from.
        prompt_version:
          type: string
        written_at:
          type: string
          format: date-time

    StyleMeasure:
      type: object
      required: [id, label, value]
      properties:
        id:
          type: string
          description: |
            A stable name of the line (`shots`, `first_cut`, `effects`, `look`, `title`, `music`, `length`, `ending`, `shot_tail`,
            `transitions`, `camera`, `cuts`, `title_entrance`, `title_form`, `chapters` ...).
        label:
          type: string
        value:
          type: string

    StyleMeasures:
      type: object
      description: What was measured from the reference videos, in plain words.
      required: [references, confidence, firm, lines]
      properties:
        references:
          type: integer
          minimum: 0
        confidence:
          type: number
          minimum: 0
          maximum: 1
        firm:
          type: boolean
          description: Enough videos (3 or more) for the editor's checks to hold an edit to the measures; fewer are a hint.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StyleMeasure"

    StyleReferenceStatus:
      type: string
      description: "`uploading`, `processing` (the file is being prepared), `analysing` (its style is being measured), `ready` or `failed`."
      enum: [uploading, processing, analysing, ready, failed]

    StyleReference:
      type: object
      required: [asset_id, name, status, failure_reason, progress, duration_ms, poster_url, created_at]
      properties:
        asset_id:
          type: [string, "null"]
          pattern: "^ast_[0-7][0-9a-hjkmnp-tv-z]{25}$"
          description: The reference's asset; `null` for a video measured by the team from a file (it can only be removed by resetting the style).
        name:
          type: string
          description: The file's name.
        status:
          $ref: "#/components/schemas/StyleReferenceStatus"
        failure_reason:
          type: [string, "null"]
          description: |
            Why it is `failed`, a code that is safe to show: an upload or ingest code of the asset (see `Asset.failure_reason`), or
            `too_long` (over 3 minutes), `no_video_stream`, `analysis_failed`.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: How far the preparation of the file is while `processing`.
        duration_ms:
          type: [integer, "null"]
        poster_url:
          type: [string, "null"]
          description: A short-lived URL of a still of the video, until `poster_urls_expire_at`.
        created_at:
          type: string
          format: date-time

    StyleLimits:
      type: object
      required: [max_references, max_size_bytes, max_duration_ms]
      properties:
        max_references:
          type: integer
        max_size_bytes:
          type: integer
          format: int64
        max_duration_ms:
          type: integer

    StyleProgress:
      type: object
      required: [done, total]
      properties:
        done:
          type: integer
          minimum: 0
          description: References measured.
        total:
          type: integer
          minimum: 0
          description: References that are not failed.

    CreatorStyle:
      type: object
      required: [status, progress, summary, measures, settings, effective, references, limits, learned_at]
      properties:
        status:
          type: string
          description: "`empty` (nothing learnt and no reference), `learning` (references are being uploaded or measured, or the profile made) or `ready`."
          enum: [empty, learning, ready]
        progress:
          $ref: "#/components/schemas/StyleProgress"
        summary:
          oneOf:
            - $ref: "#/components/schemas/StyleSummary"
            - type: "null"
        measures:
          oneOf:
            - $ref: "#/components/schemas/StyleMeasures"
            - type: "null"
        settings:
          $ref: "#/components/schemas/StyleSettings"
        effective:
          $ref: "#/components/schemas/EffectiveStyleSettings"
        references:
          type: array
          items:
            $ref: "#/components/schemas/StyleReference"
        limits:
          $ref: "#/components/schemas/StyleLimits"
        learned_at:
          type: [string, "null"]
          format: date-time
          description: When the profile was last made.
        poster_urls_expire_at:
          type: string
          format: date-time
          description: When the `poster_url`s stop working. Present when one is.

    UpdateStyleRequest:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: "#/components/schemas/StyleSettings"

    # ── Annotations ─────────────────────────────────────────────────────────────

    AnnotationTargetType:
      type: string
      description: What a comment is about, and what `target_id` is a TypeID of.
      enum: [asset, render, timeline_version]

    AnnotationKind:
      type: string
      description: |
        `comment` (a note for the creator or the editor), `instruction` (a note addressed to the editor agent), or a constraint on the range:
        `include` (keep it), `exclude` (leave it out), `prefer` (favour it).
      enum: [comment, include, exclude, prefer, instruction]

    AnnotationStatus:
      type: string
      description: |
        `open`; `applied` (an editor run dealt with it: `applied_in_run_id`, and `addressed_in_version` when that run made a version); or
        `resolved` (closed by hand).
      enum: [open, applied, resolved]

    AnnotationPin:
      type: object
      description: |
        A spot on the frame, normalised to 0..1 from the top left: a point (`x`, `y`) or a box (`x`, `y` and its size `w`, `h`, which
        come together and keep the box inside the frame).
      required: [x, y]
      properties:
        x:
          type: number
          format: double
          minimum: 0
          maximum: 1
        y:
          type: number
          format: double
          minimum: 0
          maximum: 1
        w:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 1
        h:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 1

    AnnotationAuthor:
      type: object
      required: [kind, id]
      properties:
        kind:
          $ref: "#/components/schemas/AuthorKind"
        id:
          type: string
          description: The user's TypeID, or the editor run's id.

    Annotation:
      type: object
      required: [id, target_type, target_id, project_id, timeline_version, start_ms, end_ms, pin, kind, body, status, parent_id, author, applied_in_run_id, addressed_in_version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/AnnotationId"
        target_type:
          $ref: "#/components/schemas/AnnotationTargetType"
        target_id:
          type: string
          description: The TypeID of the clip, render or version.
        project_id:
          oneOf:
            - $ref: "#/components/schemas/ProjectId"
            - type: "null"
          description: The project of a comment on a render or a version. Null for a clip.
        timeline_version:
          type: [integer, "null"]
          description: The version a comment on a render or a version was made on (of a render, the version it was made from). Null for a clip.
        start_ms:
          type: integer
          format: int64
          minimum: 0
        end_ms:
          type: integer
          format: int64
          minimum: 0
          description: Equal to `start_ms` for a comment on a moment.
        pin:
          oneOf:
            - $ref: "#/components/schemas/AnnotationPin"
            - type: "null"
        kind:
          $ref: "#/components/schemas/AnnotationKind"
        body:
          type: string
        status:
          $ref: "#/components/schemas/AnnotationStatus"
        parent_id:
          oneOf:
            - $ref: "#/components/schemas/AnnotationId"
            - type: "null"
          description: "Set on a reply: the comment it answers."
        author:
          $ref: "#/components/schemas/AnnotationAuthor"
        applied_in_run_id:
          oneOf:
            - $ref: "#/components/schemas/RunId"
            - type: "null"
        addressed_in_version:
          type: [integer, "null"]
          description: The version the editor run that applied the comment made. Null while the comment is not applied, and when the run made none.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAnnotationRequest:
      type: object
      description: |
        `target_type`, `target_id` and `start_ms` are required, except in a reply (`parent_id`): a reply takes the target and the range of the
        comment it answers, and when it names them they must be the comment's own.
      properties:
        target_type:
          $ref: "#/components/schemas/AnnotationTargetType"
        target_id:
          type: string
          description: The TypeID of the clip (`ast_`), the render (`ren_`) or the version (`tl_`).
        project_id:
          $ref: "#/components/schemas/ProjectId"
        start_ms:
          type: integer
          format: int64
          minimum: 0
        end_ms:
          type: integer
          format: int64
          minimum: 0
          description: Defaults to `start_ms` (a comment on a moment).
        pin:
          $ref: "#/components/schemas/AnnotationPin"
        kind:
          allOf:
            - $ref: "#/components/schemas/AnnotationKind"
          description: Defaults to `comment`.
        body:
          type: string
          maxLength: 2000
          description: Plain text. Required (not empty) for a `comment` and an `instruction`.
        parent_id:
          $ref: "#/components/schemas/AnnotationId"

    UpdateAnnotationRequest:
      type: object
      description: Every field is optional; the ones that are absent stay as they are. At least one must be there.
      properties:
        body:
          type: string
          maxLength: 2000
        kind:
          $ref: "#/components/schemas/AnnotationKind"
        status:
          type: string
          description: "`open` (reopen) or `resolved`. A person cannot set `applied`."
          enum: [open, resolved]
        start_ms:
          type: integer
          format: int64
          minimum: 0
        end_ms:
          type: integer
          format: int64
          minimum: 0
        pin:
          $ref: "#/components/schemas/AnnotationPin"
        remove_pin:
          type: boolean
          description: Take the pin off. Not with `pin`.

    ListAnnotationsResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Annotation"
        next_cursor:
          type: [string, "null"]
          description: Pass it as `cursor` for the next page. Null on the last page.

    # ── Webhooks ────────────────────────────────────────────────────────────────

    WebhookResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: |
            `applied`: the event changed something. `duplicate`: a replay of a delivery already applied. `ignored`: an event
            type the endpoint does not handle. `rejected`: signed by Clerk, but not usable; recorded as failed and
            acknowledged so that Svix does not retry it.
          enum: [applied, duplicate, ignored, rejected]
