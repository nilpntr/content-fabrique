# Redocly CLI configuration for `bun run lint:api` (CI runs it in the contract job): the recommended rules, with the few
# that do not fit this API relaxed on purpose. `lint:api` also fails on warnings.
extends:
  - recommended
rules:
  # No public contact page yet.
  info-contact: off
  # The TypeID schemas of D-24 are defined for every prefix before the endpoints that use them exist.
  no-unused-components: off
  # The local development server is listed on purpose.
  no-server-example.com: off
