# The price list and the plans, version 2026-10 (P7-01a, docs/design/spend-control-v1.md sections 3 and 4, decision D-31).
#
# A change is a NEW FILE with a new version, never an edit of an old one: every credit ledger row names the version that priced it.
# The profit-invariant test (internal/credits) runs over every file in this directory and fails the build when a plan could lose money:
#
#   cogs_budget(action, plan) <= max_cogs_share x net_revenue_per_credit(plan) x credits(action)
#   net_revenue_per_credit(plan) = (price x (1 - mor_fee_pct) - mor_fee_fixed) x usd_per_eur / allowance_credits(plan)
#
# Money is integers: prices in euro cents, budgets in micro-dollars (millionths of a US dollar). The few decimals below (the fee
# percentage, the exchange rate, the share) are parsed exactly (no binary floats) and are used by the test only; nothing stores them.
version: "2026-10"
source: docs/design/spend-control-v1.md sections 3 and 4
notes:
  - Credits are the customer's currency; the UI shows them as videos (1 video = 10 credits = a first edit plus two revisions).
  - The numbers are the launch hypotheses of the product plan (section 10), to be validated in the beta.
  - A plan's budget for an action is the hard `budget_micros` of the agent run that performs it. The runtime stops the run at its budget.

# What each billable action costs, in credits. Ingest, quick look, analysis, transcription and previews cost nothing: the plan covers
# them and quotas cap them. export.final is free but needs an edit that was charged (the final render of a paid-for edit).
actions:
  edit.first: 6
  edit.revision: 2
  export.final: 0
  ideation.run: 1

# The merchant of record's fee on each payment (Paddle, D-29): a percentage and a fixed amount. The fixed $0.50 is written in euro
# cents at the rate below and rounded up, so the invariant is never looser than the real fee.
mor_fee_pct: 0.05
mor_fee_fixed_eur_cents: 47
usd_per_eur: 1.08

# COGS may be at most this share of what a credit earns (D-18: at least 60 % gross margin before fixed costs).
max_cogs_share: 0.40

# Abuse control (spend control v1, "Runs that end without a charge"): a run that is cancelled before it made anything, finds nothing to
# change, or fails for a reason of the creator's own (see credits.UnchargedFailureReasons) is released, not charged, but it has spent
# model money. Each plan caps how many of those a workspace may have per UTC day (`uncharged_runs_per_day`); the next start is refused
# with 429 too_many_uncharged_runs. Runs that cost nothing, and failures that are ours, do not count.

# Top-ups last this many months from the day they are granted.
topup_expiry_months: 12

# A trial earns nothing, so its budgets come from a fixed COGS allowance per trial (product plan section 10: about $2.50), spread over
# the trial's credits.
trial_cogs_allowance_micros: 2500000

plans:
  trial:
    price_eur_cents: 0
    billing_mode: managed
    allowance_credits: 20
    refill: false # 20 credits once, never refilled
    storage_gb: 2
    concurrent_runs: 1
    uncharged_runs_per_day: 5 # editor runs per UTC day that ended with nothing to charge (released after they spent money); more are refused
    transcribed_minutes_per_day: 30
    cogs_budget_micros: # 2.5 USD / 20 credits = 125,000 per credit
      edit.first: 750000
      edit.revision: 250000
      export.final: 0
      ideation.run: 125000

  studio:
    price_eur_cents: 2500
    billing_mode: byok # tokens are billed to the creator's own key
    allowance_credits: 600
    refill: true
    storage_gb: 100
    concurrent_runs: 3
    uncharged_runs_per_day: 5 # editor runs per UTC day that ended with nothing to charge (released after they spent money); more are refused
    transcribed_minutes_per_day: 240
    # The run's cap on the creator's own key (their money, not ours): the $2 default of spend control section 4.
    cogs_budget_micros:
      edit.first: 2000000
      edit.revision: 2000000
      export.final: 0
      ideation.run: 500000
    # What an action may cost US on a BYOK plan: compute, storage and transcription (the invariant checks these, not the run's cap).
    non_llm_cogs_budget_micros: # 0.40 x $0.0419 net per credit = $0.0168 per credit
      edit.first: 100000
      edit.revision: 33000
      export.final: 0
      ideation.run: 16000

  creator:
    price_eur_cents: 5900
    billing_mode: managed
    allowance_credits: 150
    refill: true
    storage_gb: 50
    concurrent_runs: 2
    uncharged_runs_per_day: 5 # editor runs per UTC day that ended with nothing to charge (released after they spent money); more are refused
    transcribed_minutes_per_day: 120
    cogs_budget_micros: # 0.40 x $0.4002 net per credit = $0.1601 per credit
      edit.first: 960000
      edit.revision: 320000
      export.final: 0
      ideation.run: 160000

  pro:
    price_eur_cents: 12900
    billing_mode: managed
    allowance_credits: 400
    refill: true
    storage_gb: 200
    concurrent_runs: 4
    uncharged_runs_per_day: 5 # editor runs per UTC day that ended with nothing to charge (released after they spent money); more are refused
    transcribed_minutes_per_day: 360
    cogs_budget_micros: # 0.40 x $0.3296 net per credit = $0.1318 per credit
      edit.first: 790000
      edit.revision: 260000
      export.final: 0
      ideation.run: 130000
