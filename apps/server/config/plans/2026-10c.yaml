# The price list and the plans, version 2026-10c (decision D-31, "the editor thinks at max effort"; docs/design/spend-control-v1.md section 3a).
#
# Why a new version: the editor now runs Opus 5.5 at effort `max` (config/routing/v1-start.yaml) and a max-effort edit needs a larger hard run
# budget than 2026-10 gave it ($0.96 for a creator's first edit). This file gives a first edit $2.00 and a revision $0.80 on every managed plan
# (a live max-effort edit cost $1.01; its largest call wrote 13,203 output tokens). The plan prices, the allowances of creator and pro, and
# max_cogs_share (0.40) are UNCHANGED: the profit invariant is not loosened, so what a plan's credits earn now pays for fewer videos.
# 2026-10.yaml stays as it was (every ledger row names the version that priced it) and is only read by the tests; the code runs on the newest
# file (credits.ListFile). Not deployed yet, so this file may still be edited until the founder confirms the numbers.
#
# The numbers are pending founder confirmation.
#
# A change is a NEW FILE with a new version, never an edit of an old one once it is deployed: every credit ledger row names the version that
# priced it. The profit-invariant test (internal/credits) runs over every file in this directory and fails the build when a plan could lose money:
#
#   cogs_budget(action, plan) <= max_cogs_share x net_revenue_per_credit(plan) x credits(action)
#   net_revenue_per_credit(plan) = (price x (1 - mor_fee_pct) - mor_fee_fixed) x usd_per_eur / allowance_credits(plan)
#
# Money is integers: prices in euro cents, budgets in micro-dollars (millionths of a US dollar). The few decimals below (the fee
# percentage, the exchange rate, the share) are parsed exactly (no binary floats) and are used by the test only; nothing stores them.
#
# How the credits per action were derived. An action's credits are one number for all plans, so they must be enough for the plan that earns
# least per credit of its allowance, which is pro (400 credits for 129 euro; creator is 150 credits for 59 euro). Pro earns $0.3296 net per
# credit, so 40 % of it is $0.131846 per credit, and:
#   edit.first    $2.00 / $0.131846 = 15.2 credits  -> 16
#   edit.revision $0.80 / $0.131846 =  6.1 credits  ->  7
# so 1 video = 16 + 2 x 7 = 30 credits. TestMaxEffortBudgetsFitTheInvariantWithTheFewestCredits checks that one credit less would break the
# invariant for some plan. Creator, which earns $0.4002 per credit, then has room to spare: its limit is $2.56 and $1.12. ideation.run stays
# at 1 credit.
version: "2026-10c"
source: docs/design/spend-control-v1.md section 3a, decision D-31
notes:
  - Credits are the customer's currency; a video is a first edit plus two revisions, so 1 video = 16 + 2 x 7 = 30 credits (credits.PriceList.CreditsPerVideo derives it, nothing else may hardcode it). The UI shows credits as videos by asking the API.
  - The editor thinks at max effort, so a first edit may cost up to $2.00 and a revision up to $0.80 (the hard budget of the run). A real edit costs a fraction of that; the budget is the backstop.
  - The numbers are the launch hypotheses of the product plan (section 10), to be validated in the beta, and pending founder confirmation (D-31).
  - A plan's budget for an action is the hard `budget_micros` of the agent run that performs it. The runtime stops the run at its budget.

# What each billable action costs, in credits. Ingest, quick look, analysis, transcription and previews cost nothing: the plan covers
# them and quotas cap them. export.final is free but needs an edit that was charged (the final render of a paid-for edit).
actions:
  edit.first: 16
  edit.revision: 7
  export.final: 0
  ideation.run: 1

# The merchant of record's fee on each payment (Paddle, D-29): a percentage and a fixed amount. The fixed $0.50 is written in euro
# cents at the rate below and rounded up, so the invariant is never looser than the real fee.
mor_fee_pct: 0.05
mor_fee_fixed_eur_cents: 47
usd_per_eur: 1.08

# COGS may be at most this share of what a credit earns (D-18: at least 60 % gross margin before fixed costs). Unchanged.
max_cogs_share: 0.40

# Abuse control (spend control v1, "Runs that end without a charge"): a run that is cancelled before it made anything, finds nothing to
# change, or fails for a reason of the creator's own (see credits.UnchargedFailureReasons) is released, not charged, but it has spent
# model money. Each plan caps how many of those a workspace may have per UTC day (`uncharged_runs_per_day`); the next start is refused
# with 429 too_many_uncharged_runs. Runs that cost nothing, and failures that are ours, do not count.

# Top-ups last this many months from the day they are granted.
topup_expiry_months: 12

# A trial earns nothing, so its budgets come from a fixed COGS allowance per trial, spread over the trial's credits. The trial gets the
# same per-edit budgets as a paying plan ($2.00 and $0.80: the first impression should be the best result), so one video (30 credits: a
# first edit and two revisions) needs 30 credits and a COGS allowance of 30 credits x $0.125 = $3.75 (it was $2.50 for 20 credits). This is
# the one place where this file spends more of our money per customer than 2026-10: worst case $3.75 per trial instead of $2.50, for one
# video instead of two.
trial_cogs_allowance_micros: 3750000

plans:
  trial:
    price_eur_cents: 0
    billing_mode: managed
    allowance_credits: 30
    refill: false # 30 credits once, never refilled: one video
    storage_gb: 2
    concurrent_runs: 1
    uncharged_runs_per_day: 5 # editor runs per UTC day that ended with nothing to charge (released after they spent money); more are refused
    transcribed_minutes_per_day: 30
    cogs_budget_micros: # 3.75 USD / 30 credits = 125,000 per credit
      edit.first: 2000000
      edit.revision: 800000
      export.final: 0
      ideation.run: 125000

  studio:
    price_eur_cents: 2500
    billing_mode: byok # tokens are billed to the creator's own key
    allowance_credits: 1800 # 60 videos at 30 credits: the same 60 videos a month as before (it was 600 credits at 10 per video); our cost is only the non-LLM budgets below
    refill: true
    storage_gb: 100
    concurrent_runs: 3
    uncharged_runs_per_day: 5 # editor runs per UTC day that ended with nothing to charge (released after they spent money); more are refused
    transcribed_minutes_per_day: 240
    # The run's cap on the creator's own key (their money, not ours): the $2 default of spend control section 4, enough for a max-effort edit.
    cogs_budget_micros:
      edit.first: 2000000
      edit.revision: 2000000
      export.final: 0
      ideation.run: 500000
    # What an action may cost US on a BYOK plan: compute, storage and transcription (the invariant checks these, not the run's cap).
    # 0.40 x $0.013968 net per credit = $0.005587 per credit, so 16 credits allow $0.0894 and 7 credits $0.0391. A first edit is therefore
    # budgeted $0.089 (it was $0.100 at 600 credits), a revision $0.033 as before, and an idea run (1 credit) $0.005 (it was $0.016). An idea
    # run has no compute of its own: it is model tokens, which are the creator's.
    non_llm_cogs_budget_micros:
      edit.first: 89000
      edit.revision: 33000
      export.final: 0
      ideation.run: 5000

  creator:
    price_eur_cents: 5900
    billing_mode: managed
    allowance_credits: 150 # 5 videos at 30 credits (it was 15 at 10 per video). The limit of the invariant is 192 credits (6.4 videos), see the PR
    refill: true
    storage_gb: 50
    concurrent_runs: 2
    uncharged_runs_per_day: 5 # editor runs per UTC day that ended with nothing to charge (released after they spent money); more are refused
    transcribed_minutes_per_day: 120
    cogs_budget_micros: # 0.40 x $0.4002 net per credit = $0.1601 per credit: 16 credits allow $2.56, 7 allow $1.12, 1 allows $0.16
      edit.first: 2000000
      edit.revision: 800000
      export.final: 0
      ideation.run: 160000

  pro:
    price_eur_cents: 12900
    billing_mode: managed
    allowance_credits: 400 # 13 videos (13.3) at 30 credits (it was 40 at 10 per video)
    refill: true
    storage_gb: 200
    concurrent_runs: 4
    uncharged_runs_per_day: 5 # editor runs per UTC day that ended with nothing to charge (released after they spent money); more are refused
    transcribed_minutes_per_day: 360
    cogs_budget_micros: # 0.40 x $0.3296 net per credit = $0.1318 per credit: 16 credits allow $2.11, 7 allow $0.92, 1 allows $0.13
      edit.first: 2000000
      edit.revision: 800000
      export.final: 0
      ideation.run: 130000
