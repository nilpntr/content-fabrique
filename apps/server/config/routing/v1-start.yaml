# The starting profile (docs/03-architecture.md §7.5, decision D-07). Opus 5.5 where judgement matters.
profile: v1-start
# Effort `max` for the editor and the revision (decision D-31, pending founder confirmation: the founder wants the best result Opus 5.5
# can give and accepts a few dollars for an edit). Thinking at that effort is long, so the output room is sized for it: max_tokens covers
# the thinking and the answer together, and an editor turn that thinks hard, writes the plan and is cut off fails the run (at 16000 it did). The editor gets 64000 tokens per call, the revision 32000.
#
# Why not more: the metered client reserves the worst case of every call before it sends it, max_tokens at the output price (64000 x
# $20/MTok = $1.28 on Opus 5.5, plus the input), and the price list (config/plans/2026-10c.yaml) gives a creator's first edit a hard run
# budget of $3.00. A call is reserved at its worst case and settled at what it really cost, so that room is tied up for one call at a time
# only: the first call reserves about $1.3 to $1.5 of the $3.00 and gives back what it did not use before the next one. A turn that is cut
# off all the same is recovered from by the agent loop (two recoveries a run), and plan_edit's fields are bounded so that the room goes to
# thinking.
# A revision runs on the `revision` entry (the credits decide first edit or revision) with 32000: its budget is $1.00, so one full call's
# reservation (32000 x $20/MTok = $0.64 plus the input) fits at the start. Whatever the entry says, the metered client cuts a call's
# max_tokens to what the run's budget can still pay for (floor((budget left - input worst case) / output price), a multiple of 16), down
# to min_output_tokens (2048 unless an entry sets it), and refuses the call below that, which ends the run at its budget (the editor then
# finishes on its newest previewed version). So late calls of a run get less room as the money runs down, and the editor is told when less
# than one full-size call is left. See spend control v1.
# There is no `escalate` entry: escalation retries one effort step up, and there is nothing above `max`. routing.Entry refuses an
# `escalate` whose effort is not above the stage's own, so one cannot be added back at an equal or lower effort by mistake.
# dev-cheap and dev-mid keep effort `medium` and 24000 tokens: they exist to smoke-test the loop, the tools and the validators for cents,
# and Haiku and Sonnet are not what max effort is for. Their limit is therefore NOT production's: a smoke test on them does not prove that
# a 64000-token call works, only a run on this profile does.
editor:
  model: claude-opus-5-5
  effort: max                    # the founder's choice (D-31), up from medium (D-17); nothing above it to escalate to
  max_tokens: 64000              # see the note above the profile
  subagents:
    inspector: { enabled: false, model: claude-haiku-5-5 }   # benchmark variant only
revision:
  model: claude-opus-5-5
  effort: max
  max_tokens: 32000              # a revision's budget is a third of a first edit's ($1.00 against $3.00 on a managed plan); see the note above the profile
research:
  lead:    { model: claude-opus-5-5, effort: medium }
  workers: { model: claude-haiku-5-5, max_parallel: 6, budget_micros: 150000 }
ideation: { model: claude-sonnet-5-5, effort: medium }
# The quick look (P1-04b): a title, description and tags for each new clip from four small frames. Haiku 5.5 in every
# profile: the call has a budget of $0.003, so no profile routes it higher.
quicklook: { model: claude-haiku-5-5, max_tokens: 700 }
# The creator style profile's text read (P6-05): how the title of a reference video looks, from three frames of the hook. Haiku 5.5 in
# every profile; each call has a budget of $0.01 (styleprofile.MaxVisionMicros).
stylevision: { model: claude-haiku-5-5, max_tokens: 600 }
tagging:  { model: claude-haiku-5-5, batch: true }    # Batch API for backfills: 50 % off
judge:    { model: claude-opus-5-5, effort: high, batch: true }
