# The starting profile (docs/03-architecture.md §7.5, decision D-07). Opus 5.5 where judgement matters.
profile: v1-start
# The editor and the revision get 24000 tokens of output room per call (max_tokens covers the thinking and the answer together). The
# default of 16000 was not enough for Opus: its plan_edit turn thought, wrote the plan and was cut off, and the run failed. Why not
# more: the metered client reserves the worst case of every call before it sends it, max_tokens at the output price (24000 x $20/MTok
# = $0.48 on Opus 5.5), and the spend plan gives a creator's first edit a budget of about $0.96, so a larger room would leave the run
# too little to make calls with. A turn that is cut off all the same is recovered from by the agent loop (two recoveries a run), and
# plan_edit's fields are bounded so that the room goes to thinking. dev-mid and dev-cheap use the same number, so a smoke test on
# them meets the same limit.
# A revision runs on the `revision` entry (the credits decide first edit or revision) with 12000: its budget on the creator plan is $0.32,
# so one full call's reservation (12000 x $20/MTok = $0.24 plus the input) fits once. Whatever the entry says, the metered client cuts a
# call's max_tokens to what the run's budget can still pay for, down to min_output_tokens (2048 unless an entry sets it), and refuses the
# call below that, which ends the run at its budget (the editor then finishes on its newest previewed version). See spend control v1.
editor:
  model: claude-opus-5-5
  effort: medium                 # Opus 5.5's default, set explicitly; tuned by D-17
  max_tokens: 24000              # see the note above the profile
  escalate: { when: hard_constraints_failed, effort: high, max_attempts: 1 }
  subagents:
    inspector: { enabled: false, model: claude-haiku-5-5 }   # benchmark variant only
revision:
  model: claude-opus-5-5
  effort: medium
  max_tokens: 12000              # a revision's budget is a third of a first edit's ($0.32 on creator); see the note above the profile
research:
  lead:    { model: claude-opus-5-5, effort: medium }
  workers: { model: claude-haiku-5-5, max_parallel: 6, budget_micros: 150000 }
ideation: { model: claude-sonnet-5-5, effort: medium }
# The quick look (P1-04b): a title, description and tags for each new clip from four small frames. Haiku 5.5 in every
# profile: the call has a budget of $0.003, so no profile routes it higher.
quicklook: { model: claude-haiku-5-5, max_tokens: 400 }
tagging:  { model: claude-haiku-5-5, batch: true }    # Batch API for backfills: 50 % off
judge:    { model: claude-opus-5-5, effort: high, batch: true }
