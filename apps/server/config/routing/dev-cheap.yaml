# Rung 1 of the cheap-first ladder (decision D-22): Haiku 5.5 for every stage, about $0.02 per editor run.
# Same shape as v1-start. Use it until the loop, tools and validators are solid.
profile: dev-cheap
editor:
  model: claude-haiku-5-5
  effort: medium
  escalate: { when: hard_constraints_failed, effort: high, max_attempts: 1 }
  subagents:
    inspector: { enabled: false, model: claude-haiku-5-5 }
revision:
  model: claude-haiku-5-5
  effort: medium
research:
  lead:    { model: claude-haiku-5-5, effort: medium }
  workers: { model: claude-haiku-5-5, max_parallel: 6, budget_micros: 150000 }
ideation: { model: claude-haiku-5-5, effort: medium }
# The quick look (P1-04b): a title, description and tags for each new clip from four small frames. Haiku 5.5 in every
# profile: the call has a budget of $0.003, so no profile routes it higher.
quicklook: { model: claude-haiku-5-5, max_tokens: 400 }
tagging:  { model: claude-haiku-5-5, batch: true }
judge:    { model: claude-haiku-5-5, effort: high, batch: true }
