# Rung 1 of the cheap-first ladder (decision D-22): Haiku 5.5 for every stage, about $0.02 per editor run.
# Same shape as v1-start. Use it until the loop, tools and validators are solid.
profile: dev-cheap
editor:
  model: claude-haiku-5-5
  effort: medium
  max_tokens: 24000
  escalate: { when: hard_constraints_failed, effort: high, max_attempts: 1 }
  subagents:
    inspector: { enabled: false, model: claude-haiku-5-5 }
revision:
  model: claude-haiku-5-5
  effort: medium
  max_tokens: 24000
# Extra careful (D-31): the `_max` entries exist so that a smoke test can take the quality: max path through the whole stack for cents. They
# are NOT max effort here (Haiku and Sonnet are not what it is for): effort high, and the same limits as the standard entries.
editor_max:
  model: claude-haiku-5-5
  effort: high
  max_tokens: 24000
revision_max:
  model: claude-haiku-5-5
  effort: high
  max_tokens: 24000
research:
  lead:    { model: claude-haiku-5-5, effort: medium }
  workers: { model: claude-haiku-5-5, max_parallel: 6, budget_micros: 150000 }
ideation: { model: claude-haiku-5-5, effort: medium }
# The quick look (P1-04b): a title, description and tags for each new clip from four small frames. Haiku 5.5 in every
# profile: the call has a budget of $0.003, so no profile routes it higher.
quicklook: { model: claude-haiku-5-5, max_tokens: 700 }
# The creator style profile's text read (P6-05, stylevision.v3): the title, how it comes on and the chapter titles, from up to 8 frames. Haiku 5.5 in
# every profile; each call has a budget of $0.01 (styleprofile.MaxVisionMicros).
stylevision: { model: claude-haiku-5-5, max_tokens: 800 }
# The style summary (P6-05b): one call per (re)analysis that describes the creator's style in plain words and suggests the default
# settings, from the measures and up to three frames. Haiku 5.5 here; each call has a budget of $0.03 (styleprofile.MaxSummaryMicros).
stylesummary: { model: claude-haiku-5-5, max_tokens: 800 }
tagging:  { model: claude-haiku-5-5, batch: true }
judge:    { model: claude-haiku-5-5, effort: high, batch: true }
# The eval suite's judge of a finished edit (D-38, observability v1 section 7). The suite resolves the judge from v1-start (Sonnet 5.5)
# whatever ROUTING_PROFILE says, so that scores stay comparable; this Haiku entry only exists so dev-cheap stays Haiku-only and is used
# when a run asks for --judge-profile dev-cheap (a smoke test of the plumbing, not a score to compare).
judge_edit: { model: claude-haiku-5-5, max_tokens: 3000 }
# The improvement loop's improver (cfctl eval improve, observability v1 section 8): one call per iteration that proposes one change
# to the prompt, a playbook, a check threshold, a renderer default or a style rule, with its own budget (--improver-usd, default
# $0.50). The loop resolves it from v1-start (Opus 5.5) whatever ROUTING_PROFILE says; the cheaper entries are for plumbing tests.
improve_edit: { model: claude-haiku-5-5, max_tokens: 6000 }
