# The clip labels (package taxonomy): a small fixed vocabulary of facets instead of free-form tags, so a library of a few hundred
# clips has a few dozen labels and not hundreds of near-duplicates ("back view", "rear view"; "back training", "back workout").
#
# facets: what a clip is labelled with, in the order the app and the editor show them. Every facet has at most about ten values.
#   id      the key in the API (`?body=back`) and in assets.facets ("body:back"). Never renamed: a rename is a new version of this file.
#   label   the creator's word for it, in the app.
#   max     how many values of the facet one clip may have.
#   values  id (lowercase, a-z and _), label, and:
#           source: probe   set from the file itself (the frame rate), never by the model or a synonym;
#           implies         what the value says about the facets the clip has no value for yet ("row" works the back and is a lift).
#
# synonyms: free words (the quick look's old tags, a model's answer outside the lists, an exercise name) mapped onto facet values,
#   as "facet:value". A text is read word by word, the longest phrase that is listed first ("seated cable row" finds "cable row"); a
#   word that is not listed carries nothing. The ids and labels of the values are synonyms too, unless listed here otherwise.
#   Lowercase; any character that is not a letter or a digit only separates words ("close-up" is "close up").
#
# ignore: words known to say nothing worth a label ("gym", "dark background"). They map to nothing, like an unknown word; listing
#   them says that they were looked at.
version: 1

facets:
  - id: type
    label: Type
    max: 1
    values:
      - { id: lift, label: Lifting }
      - { id: pose, label: Posing }
      - { id: talk, label: Talking }
      - { id: b_roll, label: B-roll }
      - { id: product, label: Product }
      - { id: before_after, label: Before and after }
      - { id: slow_motion, label: Slow motion, source: probe }

  - id: body
    label: Body part
    max: 2
    values:
      - { id: back, label: Back }
      - { id: chest, label: Chest }
      - { id: shoulders, label: Shoulders }
      - { id: arms, label: Arms }
      - { id: legs, label: Legs }
      - { id: glutes, label: Glutes }
      - { id: core, label: Core }
      - { id: full_body, label: Full body }

  - id: movement
    label: Movement
    max: 1
    values:
      - { id: pull, label: Pull, implies: [type:lift, body:back] }
      - { id: row, label: Row, implies: [type:lift, body:back] }
      - { id: press, label: Press, implies: [type:lift] }
      - { id: fly, label: Fly, implies: [type:lift, body:chest] }
      - { id: squat, label: Squat, implies: [type:lift, body:legs] }
      - { id: hinge, label: Hinge, implies: [type:lift] }
      - { id: curl, label: Curl, implies: [type:lift, body:arms] }
      - { id: extension, label: Extension, implies: [type:lift] }
      - { id: raise, label: Raise, implies: [type:lift, body:shoulders] }
      - { id: cardio, label: Cardio }
      - { id: stretch, label: Stretch }

  - id: angle
    label: Angle
    max: 2
    values:
      - { id: front, label: Front view }
      - { id: side, label: Side view }
      - { id: back, label: Back view }
      - { id: close_up, label: Close-up }
      - { id: wide, label: Wide shot }

  - id: equipment
    label: Equipment
    max: 2
    values:
      - { id: machine, label: Machine }
      - { id: cable, label: Cable }
      - { id: dumbbell, label: Dumbbell }
      - { id: barbell, label: Barbell }
      - { id: kettlebell, label: Kettlebell }
      - { id: band, label: Band }
      - { id: bodyweight, label: Bodyweight }

