# sqlc generates internal/store/db from the migrations (the schema) and internal/store/queries.
# Run `task gen:sql` (or `go tool sqlc generate` in apps/server) after changing either, and commit the output:
# CI regenerates it and fails on any difference.
version: "2"
sql:
  - engine: postgresql
    # sqlc reads the goose files: it applies the Up sections in order and skips the Down sections.
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          # Nullable ids stay pgtype.UUID: ids.ID writes the nil UUID, not NULL, for its zero value.
          - column: "usage_ledger.project_id"
            go_type: { import: "github.com/jackc/pgx/v5/pgtype", type: "UUID" }
          - column: "spend_holds.workspace_id"
            go_type: { import: "github.com/jackc/pgx/v5/pgtype", type: "UUID" }
          - column: "spend_counters.workspace_id"
            go_type: { import: "github.com/jackc/pgx/v5/pgtype", type: "UUID" }
          # Primary and foreign keys use the typed IDs of internal/ids, so a UserID cannot be passed as a WorkspaceID.
          - column: "workspaces.id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "WorkspaceID" }
          - column: "*.workspace_id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "WorkspaceID" }
          - column: "users.id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "UserID" }
          - column: "*.user_id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "UserID" }
          - column: "assets.id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "AssetID" }
          - column: "*.asset_id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "AssetID" }
          - column: "projects.id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "ProjectID" }
          - column: "*.project_id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "ProjectID" }
          - column: "timeline_versions.id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "TimelineID" }
          - column: "renders.id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "RenderID" }
          - column: "annotations.id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "AnnotationID" }
          - column: "annotations.parent_id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "AnnotationID" }
          - column: "projects.created_by"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "UserID" }
          - column: "uploads.id"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "UploadID" }
          - column: "assets.created_by"
            go_type: { import: "github.com/nilpntr/content-fabrique/internal/ids", type: "UserID" }
          # The generated search vector is never read by Go, but a row scan needs a type for it.
          - column: "assets.search"
            go_type: { import: "github.com/jackc/pgx/v5/pgtype", type: "TSVector" }
          # Any other uuid is a plain google/uuid.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          # A nullable timestamp (deleted_at) is a *time.Time, nil when unset.
          - db_type: "timestamptz"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
