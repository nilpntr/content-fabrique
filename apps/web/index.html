<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='9.5' fill='%230b0b0b'/%3E%3Crect x='8.5' y='8.5' width='6.5' height='6.5' rx='2' fill='%2383b0ff'/%3E%3Crect x='17' y='8.5' width='6.5' height='6.5' rx='2' fill='%23fcfcfb' fill-opacity='0.9'/%3E%3Crect x='8.5' y='17' width='6.5' height='6.5' rx='2' fill='%23fcfcfb' fill-opacity='0.5'/%3E%3Crect x='17' y='17' width='6.5' height='6.5' rx='2' fill='%23fcfcfb' fill-opacity='0.5'/%3E%3C/svg%3E" />
    <script>
      (function () {
        var stored = localStorage.getItem("dashboard-theme");
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
