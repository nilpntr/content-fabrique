name: web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # One bun.lock at the repo root covers the whole workspace (apps/web and packages/*).
      - run: bun install --frozen-lockfile
      - run: bun run --filter @cf/web typecheck
      - run: bun run --filter @cf/web test
      - run: bun run --filter @cf/web build
      # Start regenerates the route tree on build; a diff means the committed one is stale.
      - run: git diff --exit-code -- apps/web/src/routeTree.gen.ts
