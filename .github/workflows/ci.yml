# The one CI workflow (P0-03). It replaces web.yml and env.yml.
#
# Required checks and path filters do not mix: a required job that `paths:` skips stays "pending" and blocks the PR
# forever. So this workflow always runs, `changes` decides which jobs have work to do, and the last job, `required`,
# always runs and is the ONLY check to mark as required on `main`. It fails when any job failed or was cancelled, and
# accepts skipped ones (a docs-only PR skips everything and passes).
#
# CI holds no secrets (D-21/D-22: replay mode), so permissions stay read-only.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the older run. Other events get a group per commit, so runs on main are never
# cancelled or replaced in the queue by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On pull requests: which areas changed. On push to main and manual runs everything runs (the outputs default to
  # 'true' because the filter step is skipped and an empty output falls through to the second operand).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go || 'true' }}
      web: ${{ steps.filter.outputs.web || 'true' }}
      env: ${{ steps.filter.outputs.env || 'true' }}
      doctor: ${{ steps.filter.outputs.doctor || 'true' }}
      media_licences: ${{ steps.filter.outputs.media_licences || 'true' }}
      media_sandbox: ${{ steps.filter.outputs.media_sandbox || 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - 'apps/server/**'
              - '.env.example'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            env:
              - 'apps/**'
              - 'packages/**'
              - '.env.example'
              - 'go.work'
              - '.github/workflows/ci.yml'
            # doctor starts Postgres and MinIO, so web-only changes skip it. env-lint also scans the web code.
            doctor:
              - 'apps/server/**'
              - '.env.example'
              - 'go.work'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
            # The media-tools image and its licence allowlist (P1-03, D-16).
            media_licences:
              - 'packages/media-tools/**'
              - '.github/workflows/ci.yml'
            # Everything that decides how media jobs are sandboxed: the image, the providers, the media wrappers, cfctl media.
            media_sandbox:
              - 'packages/media-tools/**'
              - 'apps/server/internal/sandbox/**'
              - 'apps/server/internal/media/**'
              - 'apps/server/cmd/cfctl/media*.go'
              - '.github/workflows/ci.yml'

  # go vet and golangci-lint (apps/server/.golangci.yml).
  # Only go-test saves setup-go's cache (modules and the -race build cache); all jobs share one key and the first to
  # finish would otherwise win it. The other Go jobs run with `cache: false`; golangci-lint-action has its own cache.
  go-lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0
          working-directory: apps/server

  # go test -race over every package. Docker is on the runner, so tests that start containers (testcontainers) run.
  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: go test -race ./...

  # `cfctl migrate` against a real Postgres: up, down to 0, up again, redo. The sqlc output must match what is committed.
  # The repository, round-trip and role-split tests run in go-test (they start Postgres themselves).
  db:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The same image as the doctor job and compose.yaml (what `pg18` pointed to on 2026-10-17). Change all three together.
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: cf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf -d cf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The local default of .env.example. cfctl reads it from the process environment: there is no .env in CI.
      DATABASE_MIGRATE_URL: postgres://cf:cf@localhost:5432/cf?sslmode=disable
      # down and redo run without --yes only for an explicit local or ci CF_ENV on localhost, both from one source.
      CF_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - name: Build cfctl
        working-directory: apps/server
        run: go build -o "$RUNNER_TEMP/cfctl" ./cmd/cfctl
      - name: cfctl migrate up
        run: '"$RUNNER_TEMP/cfctl" migrate up'
      - name: cfctl migrate down to 0
        run: '"$RUNNER_TEMP/cfctl" migrate down --to 0'
      - name: cfctl migrate up again
        run: '"$RUNNER_TEMP/cfctl" migrate up'
      - name: cfctl migrate redo
        run: '"$RUNNER_TEMP/cfctl" migrate redo'
      - name: cfctl migrate status
        run: '"$RUNNER_TEMP/cfctl" migrate status'
      # sqlc is pinned by a `tool` directive in go.mod, so this needs no install.
      - name: sqlc drift check
        working-directory: apps/server
        run: |
          go tool sqlc generate
          git diff --exit-code -- internal/store/db
          test -z "$(git status --porcelain -- internal/store/db)" || { git status --porcelain -- internal/store/db; exit 1; }

  # typecheck, lint, test and build of @cf/web, and typecheck, tests and the generated-types drift check of @cf/schemas.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # bun's global download cache, keyed on the lockfile. One bun.lock at the repo root covers the whole workspace.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --filter @cf/schemas typecheck
      - run: bun run --filter @cf/schemas test
      # Regenerates timeline/v1.ts from the JSON Schema; a diff means the committed one is stale.
      - run: bun run --filter @cf/schemas gen:check
      - run: bun run --filter @cf/web typecheck
      - run: bun run --filter @cf/web lint
      - run: bun run --filter @cf/web test
      - run: bun run --filter @cf/web build
      # Start regenerates the route tree on build; a diff means the committed one is stale.
      - run: git diff --exit-code -- apps/web/src/routeTree.gen.ts

  # Fails when the code reads a variable that .env.example does not list.
  env-lint:
    needs: changes
    if: needs.changes.outputs.env == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - name: cfctl env lint
        working-directory: apps/server
        run: go run ./cmd/cfctl env lint

  # Runs `cfctl doctor --env ci` against a Postgres service container and MinIO, with the .env.example local
  # defaults. CI holds no secrets: Anthropic and Clerk are not used in ci (replay mode, D-22), so doctor skips them.
  doctor:
    needs: changes
    if: needs.changes.outputs.doctor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Pinned by digest (what `pg18` pointed to on 2026-10-17), the same one as the db job and compose.yaml. Change all together.
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: cf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf -d cf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache: false

      # MinIO is started here, not as a service container, because a service container cannot pass `server /data`.
      # The root user and password and the bucket are the R2_* defaults in .env.example. MinIO no longer publishes
      # public images on Docker Hub or quay.io, so this is Chainguard's build, pinned by digest. The digest is what
      # the tag `latest` pointed to on 2026-10-16; its entrypoint is /usr/bin/minio, so the args are `server /data`.
      # The bucket is made with the AWS CLI that ubuntu-latest ships, so no mc image is needed.
      - name: Start MinIO and create the bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8 \
            server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/ready && break
            sleep 1
          done
          out=$(aws --endpoint-url http://localhost:9000 s3 mb s3://cf-media-dev 2>&1) || {
            echo "$out" | grep -Eq "BucketAlreadyOwnedByYou|BucketAlreadyExists" || { echo "$out"; exit 1; }
          }

      - name: Build cfctl
        working-directory: apps/server
        run: go build -o "$RUNNER_TEMP/cfctl" ./cmd/cfctl

      # The values are .env.example's local defaults plus the secrets `env init` generates. CF_ENV is appended
      # because a later assignment of a name wins.
      - name: Generate the CI env file
        run: |
          "$RUNNER_TEMP/cfctl" env init --env-file "$RUNNER_TEMP/ci.env"
          echo "CF_ENV=ci" >> "$RUNNER_TEMP/ci.env"

      - name: cfctl doctor --env ci
        run: '"$RUNNER_TEMP/cfctl" doctor --env ci --env-file "$RUNNER_TEMP/ci.env"'

  # The media-tools image (P1-03): build it, check its shape and its licences. The licence check fails on anything outside
  # packages/media-tools/licenses/policy.json, the allowlist D-16 (as amended) asks for: permissive licences, plus the named
  # GPL/LGPL exceptions (ffmpeg, x264 and their runtime libraries, run as separate processes in our containers). It also
  # fails when LICENSES.md's generated inventory is stale. Then cfctl probes a generated clip through the docker provider and
  # the sandbox integration tests run against the image. The image is built from pinned inputs (base image digest, Debian
  # snapshot date, ffmpeg checksum), so the result does not drift on its own.
  media-tools:
    needs: changes
    if: needs.changes.outputs.media_licences == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache: false

      - name: Licence check tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -m unittest discover -s packages/media-tools/licenses -v

      - name: Build the image
        run: docker build --tag media-tools:ci packages/media-tools

      # No shell, not root, a working ffmpeg that is a GPL build without anything non-free, and it runs the way the sandbox runs it.
      - name: Image shape
        run: |
          user=$(docker image inspect media-tools:ci --format '{{.Config.User}}')
          echo "user: $user"
          case "$user" in ""|0|0:*|root|root:*) echo "the image must not run as root" >&2; exit 1;; esac
          if docker run --rm --entrypoint sh media-tools:ci -c true 2>/dev/null; then
            echo "the image must not contain a shell" >&2; exit 1
          fi
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 12345:12345 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m media-tools:ci ffmpeg -hide_banner -version | tee "$RUNNER_TEMP/ffmpeg-version.txt"
          grep -q -- '--enable-gpl' "$RUNNER_TEMP/ffmpeg-version.txt"
          if grep -q -- '--enable-nonfree' "$RUNNER_TEMP/ffmpeg-version.txt"; then
            echo "ffmpeg must not be a nonfree build" >&2; exit 1
          fi
          docker run --rm --network none --read-only --user 12345:12345 media-tools:ci ffprobe -hide_banner -version | head -1

      - name: Licence inventory
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I packages/media-tools/licenses/check.py --image media-tools:ci \
            --check-md packages/media-tools/LICENSES.md --save-md-to "$RUNNER_TEMP/licence-inventory.md"
      # When the check says LICENSES.md is stale, this is the file to commit (its block replaces the generated one).
      - name: Keep the generated inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-inventory
          path: ${{ runner.temp }}/licence-inventory.md
          if-no-files-found: ignore

      - name: cfctl media probe through the docker provider
        working-directory: apps/server
        run: |
          go build -o "$RUNNER_TEMP/cfctl" ./cmd/cfctl
          mkdir "$RUNNER_TEMP/clips"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/clips,dst=/work" media-tools:ci \
            ffmpeg -nostdin -v error -f lavfi -i testsrc2=size=1280x720:rate=30:duration=2 -f lavfi -i sine=duration=2 \
            -vf setparams=color_primaries=bt2020:color_trc=arib-std-b67:colorspace=bt2020nc -c:v libx264 -pix_fmt yuv420p -c:a aac /work/hlg.mp4
          "$RUNNER_TEMP/cfctl" media probe "$RUNNER_TEMP/clips/hlg.mp4" --provider docker --image media-tools:ci | tee "$RUNNER_TEMP/probe.txt"
          grep -q 'HDR HLG' "$RUNNER_TEMP/probe.txt"
          grep -q '1280x720' "$RUNNER_TEMP/probe.txt"

      - name: Sandbox integration tests against the image
        working-directory: apps/server
        run: go test ./internal/sandbox -run Integration -docker-image media-tools:ci -v

  # gVisor overhead (D-08, P1-03): installs runsc (pinned and checksum-verified), registers it with Docker, then transcodes a
  # generated 1080p 30 s clip with the docker and hardened providers three times each and prints the table. It also runs the
  # sandbox integration tests under runsc. Runs on manual dispatch and on pull requests that touch the sandbox or the image.
  gvisor-bench:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.media_sandbox == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # https://storage.googleapis.com/gvisor/releases/release/<RELEASE>/x86_64/gvisor.tar.zstd and its .sha512
      GVISOR_RELEASE: '20261012.0'
      GVISOR_SHA512: ce2e1aeb853c104e854dea6644333a1dba0fbc9dd1646af97e1d013fdf810da6d4176dd96f2139d7b055e5382117c0d7c4567ebd64ed9bef47fdd15f80fd67ab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache: false

      - name: Install runsc and register it with Docker
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gvisor.tar.zstd" \
            "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.zstd"
          echo "${GVISOR_SHA512}  $RUNNER_TEMP/gvisor.tar.zstd" | sha512sum -c -
          sudo tar --zstd -xf "$RUNNER_TEMP/gvisor.tar.zstd" -C /usr/local/bin
          runsc --version
          sudo runsc install
          sudo systemctl reload docker || sudo systemctl restart docker
          sleep 3
          docker info --format '{{json .Runtimes}}' | tee "$RUNNER_TEMP/runtimes.json"
          grep -q runsc "$RUNNER_TEMP/runtimes.json"

      - name: Prove containers really run under gVisor
        run: |
          base=debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
          echo "runc : $(docker run --rm "$base" cat /proc/version)"
          echo "runsc: $(docker run --rm --runtime runsc "$base" cat /proc/version)"
          # gVisor presents itself as a 4.4.0 kernel.
          docker run --rm --runtime runsc "$base" cat /proc/version | grep -q 'Linux version 4.4.0'

      - name: Build the image
        run: docker build --tag media-tools:ci packages/media-tools

      - name: Sandbox integration tests under runsc
        working-directory: apps/server
        run: go test ./internal/sandbox -run Integration -docker-image media-tools:ci -docker-runtime runsc -v

      - name: Benchmark
        working-directory: apps/server
        run: |
          {
            echo "## gVisor overhead (cfctl media bench)"
            echo
            echo "gVisor release ${GVISOR_RELEASE}. Runner: $(nproc) vCPUs, $(free -m | awk '/Mem:/ {print $2}') MiB RAM, $(uname -sr)."
            echo
            go run ./cmd/cfctl media bench --providers docker,hardened --runs 3 --image media-tools:ci --cpus 2 --memory 2048
          } | tee "$RUNNER_TEMP/bench.md"
          cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvisor-bench
          path: ${{ runner.temp }}/bench.md
          if-no-files-found: ignore

  # The single required check. It runs even when needed jobs are skipped or failed (`if: always()`), passes when every
  # needed job succeeded or was skipped, and fails on any failure or cancellation. Add every new job to `needs`.
  required:
    if: always()
    needs: [changes, go-lint, go-test, db, web, env-lint, doctor, media-tools, gvisor-bench]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
