# Environment checks (P0-14). The main CI (Go, web, Renovate) is P0-03's; this file only guards .env.example.
name: env

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fails when the code reads a variable that .env.example does not list.
  env-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: cfctl env lint
        working-directory: apps/server
        run: go run ./cmd/cfctl env lint

  # Runs `cfctl doctor --env ci` against a Postgres service container and MinIO, with the .env.example local
  # defaults. CI holds no secrets: Anthropic and Clerk are not used in ci (replay mode, D-22), so doctor skips them.
  doctor:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: cf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf -d cf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      # MinIO is started here, not as a service container, because a service container cannot pass `server /data`.
      # The root user and password and the bucket are the R2_* defaults in .env.example. MinIO no longer publishes
      # public images on Docker Hub or quay.io, so this is Chainguard's build, pinned by digest. The digest is what
      # the tag `latest` pointed to on 2026-10-16; its entrypoint is /usr/bin/minio, so the args are `server /data`.
      # The bucket is made with the AWS CLI that ubuntu-latest ships, so no mc image is needed.
      - name: Start MinIO and create the bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8 \
            server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/ready && break
            sleep 1
          done
          out=$(aws --endpoint-url http://localhost:9000 s3 mb s3://cf-media-dev 2>&1) || {
            echo "$out" | grep -Eq "BucketAlreadyOwnedByYou|BucketAlreadyExists" || { echo "$out"; exit 1; }
          }

      - name: Build cfctl
        working-directory: apps/server
        run: go build -o "$RUNNER_TEMP/cfctl" ./cmd/cfctl

      # The values are .env.example's local defaults plus the secrets `env init` generates. CF_ENV is appended
      # because a later assignment of a name wins.
      - name: Generate the CI env file
        run: |
          "$RUNNER_TEMP/cfctl" env init --env-file "$RUNNER_TEMP/ci.env"
          echo "CF_ENV=ci" >> "$RUNNER_TEMP/ci.env"

      - name: cfctl doctor --env ci
        run: '"$RUNNER_TEMP/cfctl" doctor --env ci --env-file "$RUNNER_TEMP/ci.env"'
