# https://taskfile.dev. `task` with no arguments lists everything. P0-14 added the env tasks, P0-02 the monorepo ones.
version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ── Local development ───────────────────────────────────────────────────────

  dev:
    desc: "Start everything locally: Postgres + MinIO (Docker), then web (:3000), api (:8080) and worker (:8081, River UI on :8082). Ctrl-C stops the three processes"
    cmds:
      - task: install
      - task: env:sync
      - task: media:image
      - task: up
      - task: migrate:dev
      # Loads .env, builds the api and worker, runs the three processes and stops them together (see the script).
      - ./scripts/dev.sh

  media:build:
    desc: Build the local media-tools image (media-tools:dev, ffmpeg + fonts) that the worker runs ingests, previews and renders in
    cmds:
      - ./scripts/media-image.sh build

  # Runs on every `task dev`: rebuilds media-tools:dev when it is missing, older than the newest commit that touched
  # packages/media-tools, or built before the fonts were added. Without Docker it only warns. MEDIA_IMAGE_SKIP_BUILD=1 only warns.
  media:image:
    internal: true
    silent: true
    cmds:
      - ./scripts/media-image.sh ensure

  # Runs on every `task dev`: creates .env if it is missing, fills the empty generated secrets and adds the [AUTO] defaults
  # an older .env lacks (DATABASE_MIGRATE_URL, say). Silent when nothing changes; it lists variable names when it does.
  env:sync:
    internal: true
    silent: true
    dir: apps/server
    cmds:
      - go run ./cmd/cfctl env init --quiet

  up:
    desc: Start Postgres and MinIO with Docker Compose, wait until they are healthy, and create the bucket
    cmds:
      - docker compose up -d --wait postgres minio
      # A one-shot service, so it is run on its own: `up --wait` treats an exited container as a failure.
      - docker compose run --rm minio-init

  down:
    desc: Stop Postgres and MinIO (the data stays in the Docker volumes)
    cmds:
      - docker compose down

  reset:
    desc: Stop Postgres and MinIO and DELETE their data (the Docker volumes)
    prompt: This deletes the local database and bucket. Continue?
    cmds:
      - docker compose down --volumes

  # ── Database ────────────────────────────────────────────────────────────────

  migrate:
    desc: "Run the database migrations with DATABASE_MIGRATE_URL (default: up). Examples: task migrate -- status | task migrate -- down --to 0 | task migrate -- --env-file .env.staging up"
    dir: apps/server
    cmds:
      - go run ./cmd/cfctl migrate {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}up{{end}}

  # `task dev` migrates the local database on every start; the arguments of `task dev` are not passed on.
  migrate:dev:
    internal: true
    dir: apps/server
    cmds:
      - go run ./cmd/cfctl migrate up

  # Plans are granted by hand until billing exists (P7-01). Reads DATABASE_URL: the app's own role is enough.
  plan:
    desc: "Grant, revoke or show a plan by hand. Example: task plan -- grant --user you@example.com --plan creator [--until 2026-12-31] | task plan -- revoke --user you@example.com | task plan -- show --user you@example.com"
    dir: apps/server
    cmds:
      - go run ./cmd/cfctl plan {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}help{{end}}

  gen:sql:
    desc: Regenerate the sqlc code (apps/server/internal/store/db) from the migrations and queries. Commit the result
    dir: apps/server
    cmds:
      - go tool sqlc generate

  gen:schemas:
    desc: Regenerate the TypeScript types of the timeline JSON Schema (packages/schemas/timeline/v1.ts). Commit the result
    cmds:
      - bun run --filter @cf/schemas gen

  gen:timeline:
    desc: Copy the timeline and edit-op JSON Schemas into the Go packages that embed them (internal/timeline/schema, internal/timeline/ops/schema). Commit the result
    dir: apps/server
    cmds:
      - go generate ./internal/timeline/...

  gen:agents:
    desc: Copy the editor agent's tool contract (packages/schemas/agents/editor-tools.v1.json) into the Go package that embeds it (internal/agents/editor/contract). Commit the result
    dir: apps/server
    cmds:
      - go generate ./internal/agents/...

  gen:api:
    desc: Regenerate the code of the OpenAPI contract (packages/schemas/openapi.yaml) - the Go server interface (apps/server/internal/api) and the TypeScript types (packages/schemas/api). Commit the result
    cmds:
      - cd apps/server && go generate ./internal/api
      - bun run --filter @cf/schemas gen:api

  lint:api:
    desc: Lint the OpenAPI spec (Redocly recommended-strict ruleset, so any finding fails)
    cmds:
      - bun run --filter @cf/schemas lint:api

  gen:
    desc: Regenerate everything generated (sqlc code, the timeline types, the Go copy of the timeline schema, the Go copy of the editor tool contract, the API contract code). Commit the result
    cmds:
      - task: gen:sql
      - task: gen:schemas
      - task: gen:timeline
      - task: gen:agents
      - task: gen:api

  # ── Build and test ──────────────────────────────────────────────────────────

  install:
    desc: Install the JS dependencies of the whole workspace (one bun.lock at the root)
    cmds:
      - bun install --frozen-lockfile

  build:
    desc: Build the web app and every Go package
    cmds:
      - bun run --filter @cf/web build
      - cd apps/server && go build ./...

  test:
    desc: Run the schema tests, the web tests and the Go tests (the database tests need Docker and skip without it)
    cmds:
      - bun run --filter @cf/schemas typecheck
      - bun run --filter @cf/schemas test
      - bun run --filter @cf/web typecheck
      - bun run --filter @cf/web test
      - cd apps/server && go test ./...

  lint:
    desc: Lint the Go code (golangci-lint), the web code (Biome) and the OpenAPI spec (Redocly)
    cmds:
      - task: lint:go
      - bun run --filter @cf/web lint
      - task: lint:api

  # The same pinned version as .github/workflows/ci.yml (change both together), run through `go run`, so it needs no install.
  lint:go:
    internal: true
    dir: apps/server
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run

  # ── Environment ─────────────────────────────────────────────────────────────

  env:init:
    desc: Create .env from .env.example if missing, generate the empty [AUTO] secrets and add the [AUTO] defaults it lacks (prints names, never values)
    dir: apps/server
    cmds:
      - go run ./cmd/cfctl env init

  env:lint:
    desc: Fail if code reads an environment variable that .env.example does not list
    dir: apps/server
    cmds:
      - go run ./cmd/cfctl env lint

  doctor:
    desc: "Check the environment and every service. Default: --env local. Example: task doctor -- --env staging --phase P4"
    dir: apps/server
    cmds:
      - go run ./cmd/cfctl doctor {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}--env local{{end}}
