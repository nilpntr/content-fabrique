# Local services for development: `task up` (or `task dev`, which also starts web, api and worker).
# Compose reads the .env at the repository root, with the names from .env.example. DATABASE_URL, DATABASE_DIRECT_URL and
# DATABASE_MIGRATE_URL repeat the POSTGRES_* credentials, and R2_ENDPOINT repeats the MinIO port, so change them together.
# A variable exported in your shell overrides the .env value in Compose (scripts/dev.sh does the opposite), so do not export these names.
# Run `task env:init` first if .env does not exist yet.
name: content-fabrique

services:
  # System of record and, from P0-06, the River job queue. The same image, by the same digest, as the CI doctor and db jobs
  # (.github/workflows/ci.yml; what `pg18` pointed to on 2026-10-17). Change both together.
  postgres:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set, run task env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, run task env:init}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set, run task env:init}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Stands in for R2. MinIO no longer publishes public images, so this is Chainguard's build, pinned by the same digest as
  # .github/workflows/ci.yml (what `latest` pointed to on 2026-10-16). Change both together. The root user and password
  # are R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY, which is also what the Go code signs requests with.
  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is not set, run task env:init}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is not set, run task env:init}
      # CORS for the browser's direct part uploads (P1-01, P1-02): the web app's origin may PUT to presigned URLs, and MinIO
      # exposes the ETag header (and the rest) to it by default, which completing a multipart upload needs. Any other origin
      # gets no CORS headers. The same rule as the staging bucket (docs/06 section 3.3).
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:9000:9000" # S3 API: R2_ENDPOINT
      - "127.0.0.1:9001:9001" # web console, log in with the same R2_* credentials
    volumes:
      - minio-data:/data
    # The image has no curl or wget, so the probe is a bash /dev/tcp request to MinIO's readiness endpoint.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  # One-shot: creates the bucket named by R2_BUCKET and exits. Safe to run again, an existing bucket is left alone.
  minio-init:
    image: amazon/aws-cli:2.34.0@sha256:97cc5f847898f54432492c128408c62e0df2153d9ad36573be8e5a03826123b0
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is not set, run task env:init}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is not set, run task env:init}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      BUCKET: ${R2_BUCKET:?R2_BUCKET is not set, run task env:init}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        aws configure set default.s3.addressing_style path
        if aws s3api head-bucket --bucket "$$BUCKET" 2>/dev/null; then
          echo "bucket $$BUCKET already exists"
        else
          aws s3api create-bucket --bucket "$$BUCKET"
          echo "bucket $$BUCKET created"
        fi

  # Step-by-step traces of the agents, local only (D-39, docs/design/observability-v1.md): Arize Phoenix, under the `obs` profile so
  # `task up` and `task dev` never start it. `task dev:obs` does, and runs the stack with OTEL_EXPORTER_OTLP_ENDPOINT pointing here.
  # One port serves the UI (http://localhost:6006) and the OTLP/HTTP ingest (/v1/traces); gRPC is not used. No login: it listens on
  # loopback only. The traces, datasets and experiments live in the phoenix-data volume (`task obs:down` keeps them). Phoenix is under the
  # Elastic License 2.0: fine to run for our own development, never to offer as a service. The nonroot image of 20.23.0, pinned by the
  # digest `version-20.23.0-nonroot` had on 2026-10-18.
  phoenix:
    profiles: ["obs"]
    image: arizephoenix/phoenix:version-20.23.0-nonroot@sha256:ea0d33a28258db5e3fe46ea097d1441d0774e8b27557878296f809ccbffa7093
    environment:
      # The image runs as nonroot (uid 65532), whose home is the one directory it may write to: the volume is mounted there, so Docker
      # gives it that owner when it creates it, and Phoenix keeps its SQLite database in .phoenix under it.
      PHOENIX_WORKING_DIR: /home/nonroot/.phoenix
      # Phoenix's own usage telemetry to Arize: off.
      PHOENIX_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix-data:/home/nonroot
    # The image has no curl or wget: the probe is Python, which it runs on.
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3).status == 200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

volumes:
  postgres18-data:
  minio-data:
  phoenix-data:
